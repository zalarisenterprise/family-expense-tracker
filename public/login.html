<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Log in · Family Expense Tracker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{color-scheme:light;--bg:#f6f5f2;--surface:#fcfcfb;--surface-2:#f0efec;--line:#e3e1dc;--ink:#0b0b0b;--ink-2:#52514e;--ink-3:#8a8984;--accent:#2a78d6;--accent-soft:#e3eefb;--crit:#d03b3b;--good:#006300}
@media (prefers-color-scheme: dark){:root:where(:not([data-theme="light"])){color-scheme:dark;--bg:#121211;--surface:#1a1a19;--surface-2:#242422;--line:#333330;--ink:#f0efec;--ink-2:#c3c2b7;--ink-3:#8f8e86;--accent:#3987e5;--accent-soft:#1d2d42;--good:#4cc94c}}
:root[data-theme="dark"]{color-scheme:dark;--bg:#121211;--surface:#1a1a19;--surface-2:#242422;--line:#333330;--ink:#f0efec;--ink-2:#c3c2b7;--ink-3:#8f8e86;--accent:#3987e5;--accent-soft:#1d2d42;--good:#4cc94c}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;padding:20px;font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;background:var(--bg);color:var(--ink);font-size:14px;-webkit-font-smoothing:antialiased}
.wrap{width:100%;max-width:400px}
.brand{display:flex;align-items:center;gap:10px;justify-content:center;margin-bottom:22px;font-weight:700;font-size:17px}
.logo{width:38px;height:38px;border-radius:10px;background:var(--accent);color:#fff;display:grid;place-items:center;font-weight:700;font-size:18px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:26px 26px 22px;box-shadow:0 1px 2px rgba(0,0,0,.05),0 8px 30px rgba(0,0,0,.05)}
h1{font-size:20px;margin:0 0 4px}
.sub{color:var(--ink-2);font-size:13px;margin:0 0 20px;line-height:1.5}
label{display:flex;flex-direction:column;gap:6px;font-size:12.5px;font-weight:500;color:var(--ink-2);margin-bottom:14px}
input{font:inherit;color:inherit;background:var(--surface);border:1px solid var(--line);border-radius:9px;padding:10px 12px;min-height:42px;width:100%}
input:focus{outline:2px solid var(--accent);outline-offset:-1px}
.pw{position:relative}
.pw input{padding-right:62px}
.show{position:absolute;right:6px;top:50%;transform:translateY(-50%);border:none;background:transparent;color:var(--accent);font:inherit;font-size:12.5px;font-weight:600;cursor:pointer;padding:6px 8px}
button.primary{width:100%;border:none;background:var(--accent);color:#fff;font:inherit;font-weight:600;padding:11px;border-radius:9px;cursor:pointer;margin-top:4px;min-height:44px}
button.primary:hover{filter:brightness(1.07)}
button.primary:disabled{opacity:.6;cursor:wait}
.err{color:var(--crit);font-size:13px;min-height:18px;margin:2px 0 8px}
.hint{font-size:12px;color:var(--ink-3);margin-top:-8px;margin-bottom:14px}
.foot{text-align:center;color:var(--ink-3);font-size:12.5px;margin-top:16px;line-height:1.5}
.badge{display:inline-block;background:var(--accent-soft);color:var(--accent);font-size:11.5px;font-weight:600;padding:2px 9px;border-radius:999px;margin-bottom:10px}
</style>
</head>
<body>
<div class="wrap">
  <div class="brand"><div class="logo">₹</div>Family Expenses</div>
  <div class="card" id="card"><p class="sub">Loading…</p></div>
  <div class="foot" id="foot"></div>
</div>
<script>
const $ = s => document.querySelector(s);
try { const t = localStorage.getItem('et-theme'); if (t && t !== 'auto') document.documentElement.dataset.theme = t; } catch (e) {}

async function api(path, body) {
  const r = await fetch(path, body ? { method: 'POST', headers: { 'Content-Type': 'application/json', 'X-Requested-With': 'fetch' }, body: JSON.stringify(body), credentials: 'same-origin' } : { credentials: 'same-origin' });
  let data = {}; try { data = await r.json(); } catch (e) {}
  if (!r.ok) throw new Error(data.error || 'Something went wrong. Please try again.');
  return data;
}
function pwField(id, label, auto) {
  return `<label>${label}<div class="pw"><input type="password" id="${id}" autocomplete="${auto}" required><button type="button" class="show" data-for="${id}">Show</button></div></label>`;
}
function bindShow() {
  document.querySelectorAll('.show').forEach(b => b.onclick = () => {
    const i = document.getElementById(b.dataset.for); const s = i.type === 'password';
    i.type = s ? 'text' : 'password'; b.textContent = s ? 'Hide' : 'Show';
  });
}

function loginForm() {
  $('#card').innerHTML = `
    <h1>Welcome back</h1><p class="sub">Log in to see your expenses.</p>
    <form id="f" novalidate>
      <label>Username<input type="text" id="u" autocomplete="username" autocapitalize="none" spellcheck="false" required></label>
      ${pwField('p', 'Password', 'current-password')}
      <div class="err" id="err" role="alert"></div>
      <button class="primary" id="go">Log in</button>
    </form>`;
  $('#foot').textContent = 'Forgot your password? Ask the family admin to reset it.';
  bindShow(); $('#u').focus();
  $('#f').onsubmit = async e => {
    e.preventDefault();
    const username = $('#u').value.trim(), password = $('#p').value;
    if (!username || !password) { $('#err').textContent = 'Enter your username and password.'; return; }
    $('#go').disabled = true; $('#go').textContent = 'Logging in…'; $('#err').textContent = '';
    try { await api('/api/login', { username, password }); location.replace('/'); }
    catch (er) { $('#err').textContent = er.message; $('#go').disabled = false; $('#go').textContent = 'Log in'; $('#p').value = ''; $('#p').focus(); }
  };
}

function setupForm() {
  $('#card').innerHTML = `
    <span class="badge">First-time setup</span>
    <h1>Create the admin account</h1><p class="sub">You'll be the admin. After this you can add family members and give each of them their own username and password.</p>
    <form id="f" novalidate>
      <label>Your name<input type="text" id="n" autocomplete="name" required placeholder="e.g. Paramesh"></label>
      <label>Username<input type="text" id="u" autocomplete="username" autocapitalize="none" spellcheck="false" required placeholder="e.g. paramesh"></label>
      ${pwField('p', 'Password', 'new-password')}
      <div class="hint">At least 8 characters, with a letter and a number.</div>
      ${pwField('p2', 'Confirm password', 'new-password')}
      <div class="err" id="err" role="alert"></div>
      <button class="primary" id="go">Create admin account</button>
    </form>`;
  $('#foot').textContent = 'This screen only appears once, before any account exists.';
  bindShow(); $('#n').focus();
  $('#f').onsubmit = async e => {
    e.preventDefault();
    const name = $('#n').value.trim(), username = $('#u').value.trim(), password = $('#p').value;
    if (password !== $('#p2').value) { $('#err').textContent = "The two passwords don't match."; return; }
    $('#go').disabled = true; $('#err').textContent = '';
    try { await api('/api/setup', { name, username, password }); location.replace('/'); }
    catch (er) { $('#err').textContent = er.message; $('#go').disabled = false; }
  };
}

(async () => {
  try {
    const me = await fetch('/api/me', { credentials: 'same-origin' });
    if (me.ok) { location.replace('/'); return; }
    const s = await api('/api/setup-status');
    s.needsSetup ? setupForm() : loginForm();
  } catch (e) {
    $('#card').innerHTML = `<h1>Can't reach the server</h1><p class="sub">${e.message.replace(/</g, '&lt;')}</p><button class="primary" onclick="location.reload()">Try again</button>`;
  }
})();
</script>
</body>
</html>
