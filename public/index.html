<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Family Expense Tracker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  color-scheme: light;
  --bg:#f6f5f2; --surface:#fcfcfb; --surface-2:#f0efec; --line:#e3e1dc;
  --ink:#0b0b0b; --ink-2:#52514e; --ink-3:#8a8984;
  --accent:#2a78d6; --accent-ink:#ffffff; --accent-soft:#e3eefb;
  --good:#0ca30c; --good-ink:#006300; --warn:#fab219; --crit:#d03b3b;
  --shadow:0 1px 2px rgba(0,0,0,.05),0 4px 16px rgba(0,0,0,.04);
}
@media (prefers-color-scheme: dark){
  :root:where(:not([data-theme="light"])){
    color-scheme: dark;
    --bg:#121211; --surface:#1a1a19; --surface-2:#242422; --line:#333330;
    --ink:#f0efec; --ink-2:#c3c2b7; --ink-3:#8f8e86;
    --accent:#3987e5; --accent-ink:#ffffff; --accent-soft:#1d2d42;
    --good-ink:#4cc94c; --shadow:none;
  }
}
:root[data-theme="dark"]{
  color-scheme: dark;
  --bg:#121211; --surface:#1a1a19; --surface-2:#242422; --line:#333330;
  --ink:#f0efec; --ink-2:#c3c2b7; --ink-3:#8f8e86;
  --accent:#3987e5; --accent-ink:#ffffff; --accent-soft:#1d2d42;
  --good-ink:#4cc94c; --shadow:none;
}
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;background:var(--bg);color:var(--ink);font-size:14px;line-height:1.45;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
.app{display:grid;grid-template-columns:220px 1fr;min-height:100vh}
aside{background:var(--surface);border-right:1px solid var(--line);padding:18px 12px;display:flex;flex-direction:column;gap:4px;position:sticky;top:0;height:100vh}
.brand{display:flex;align-items:center;gap:10px;padding:4px 10px 18px;font-weight:700;font-size:15px}
.brand .logo{width:30px;height:30px;border-radius:8px;background:var(--accent);color:#fff;display:grid;place-items:center;font-weight:700}
nav a{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:8px;color:var(--ink-2);text-decoration:none;font-weight:500}
nav a:hover{background:var(--surface-2);color:var(--ink)}
nav a.active{background:var(--accent-soft);color:var(--accent)}
nav a svg{width:18px;height:18px;flex:none}
.whoami{margin-top:auto;padding:12px 10px;border-top:1px solid var(--line);font-size:12.5px;color:var(--ink-2)}
.whoami b{color:var(--ink);display:block;font-size:13.5px}
.role{display:inline-block;margin-top:4px;padding:1px 8px;border-radius:999px;background:var(--surface-2);font-size:11.5px;font-weight:600;color:var(--ink-2)}
main{padding:22px 28px 60px;max-width:1180px;width:100%}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:16px;flex-wrap:wrap}
h1{font-size:22px;margin:0;letter-spacing:-.01em}
h2{font-size:15px;margin:0 0 12px}
.sub{color:var(--ink-2);font-size:13px}
.btn{border:1px solid var(--line);background:var(--surface);padding:8px 14px;border-radius:8px;cursor:pointer;font-weight:500;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.btn:hover{background:var(--surface-2)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.07)}
.btn.small{padding:5px 10px;font-size:12.5px}
.btn.danger{color:var(--crit)}
.btn.ghost{border-color:transparent;background:transparent}
.btn:disabled{opacity:.5;cursor:not-allowed}
.filters{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:16px}
select,input[type=text],input[type=number],input[type=date],input[type=search],textarea{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:7px 10px;min-height:36px}
select:focus,input:focus,textarea:focus{outline:2px solid var(--accent);outline-offset:-1px}
.grid{display:grid;gap:14px}
.tiles{grid-template-columns:repeat(5,1fr)}
.two{grid-template-columns:1.25fr 1fr}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px 18px;box-shadow:var(--shadow);min-width:0}
.tile .lbl{font-size:12.5px;color:var(--ink-2);font-weight:500}
.tile .val{font-size:22px;font-weight:700;margin-top:4px;letter-spacing:-.01em;font-variant-numeric:tabular-nums}
.tile .meta{font-size:12px;color:var(--ink-3);margin-top:2px}
.up{color:var(--crit)} .down{color:var(--good-ink)}
.barlist{display:flex;flex-direction:column;gap:11px}
.brow{display:grid;grid-template-columns:130px 1fr 100px;gap:10px;align-items:center;font-size:13px}
.brow .name{display:flex;align-items:center;gap:7px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.dot{width:10px;height:10px;border-radius:3px;flex:none}
.track{height:10px;background:var(--surface-2);border-radius:4px;position:relative;overflow:hidden}
.fill{height:100%;border-radius:0 4px 4px 0;min-width:2px}
.brow .amt{text-align:right;font-variant-numeric:tabular-nums;font-weight:600}
.brow .amt small{display:block;font-weight:400;color:var(--ink-3);font-size:11.5px}
.budget-mark{position:absolute;top:-2px;bottom:-2px;width:2px;background:var(--ink)}
table{width:100%;border-collapse:collapse;font-size:13px}
th{text-align:left;font-weight:600;color:var(--ink-2);font-size:12px;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:9px 10px;border-bottom:1px solid var(--line);vertical-align:middle}
tr:last-child td{border-bottom:none}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.tag{display:inline-block;padding:1px 7px;border-radius:999px;background:var(--surface-2);font-size:11.5px;color:var(--ink-2);margin:1px 2px 1px 0}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:12.5px}
.empty{padding:28px;text-align:center;color:var(--ink-3)}
.tablewrap{overflow-x:auto}
.notice{padding:12px 14px;border-radius:10px;background:var(--accent-soft);color:var(--ink);margin-bottom:14px;font-size:13px}
.notice.warn{background:color-mix(in srgb,var(--warn) 18%,var(--surface))}
.status{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:600}
.status.ok{color:var(--good-ink)} .status.near{color:#a36b00} .status.over{color:var(--crit)}
:root[data-theme="dark"] .status.near{color:var(--warn)}
@media (prefers-color-scheme: dark){:root:where(:not([data-theme="light"])) .status.near{color:var(--warn)}}
/* modal */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.4);display:none;align-items:flex-start;justify-content:center;padding:6vh 14px;z-index:50;overflow:auto}
.scrim.open{display:flex}
.modal{background:var(--surface);border-radius:14px;width:100%;max-width:520px;padding:20px 22px;box-shadow:0 20px 60px rgba(0,0,0,.25)}
.modal h2{font-size:17px;margin-bottom:14px}
.form{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.form label{display:flex;flex-direction:column;gap:5px;font-size:12.5px;font-weight:500;color:var(--ink-2)}
.form .full{grid-column:1/-1}
.seg{display:inline-flex;background:var(--surface-2);border-radius:9px;padding:3px;gap:2px}
.seg button{border:none;background:transparent;padding:6px 14px;border-radius:7px;cursor:pointer;font-weight:500;color:var(--ink-2)}
.seg button.on{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.12)}
.actions{display:flex;justify-content:flex-end;gap:8px;margin-top:18px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px dashed var(--line);background:transparent;border-radius:999px;padding:4px 10px;font-size:12px;cursor:pointer;color:var(--ink-2)}
.chip:hover{border-style:solid;color:var(--ink)}
.err{color:var(--crit);font-size:12.5px;margin-top:8px;min-height:1em}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--surface);padding:10px 16px;border-radius:10px;font-size:13px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:60}
.toast.show{opacity:1}
#tip{position:fixed;pointer-events:none;background:var(--ink);color:var(--surface);padding:7px 10px;border-radius:8px;font-size:12px;opacity:0;transition:opacity .1s;z-index:70;white-space:nowrap}
#tip b{display:block}
.trend svg{width:100%;height:220px;display:block}
.trend .bar{fill:var(--accent)}
.trend .bar.cur{fill:var(--accent)}
.trend .hit{fill:transparent;cursor:default}
.trend .hit:hover + .bar, .trend g:hover .bar{filter:brightness(1.12)}
.axis text{fill:var(--ink-3);font-size:11px}
.gridline{stroke:var(--line);stroke-width:1}
.catrow{display:grid;grid-template-columns:34px 1.2fr 2fr 40px;gap:8px;align-items:center;margin-bottom:8px}
.catrow input[type=color]{width:34px;height:34px;border:1px solid var(--line);border-radius:8px;padding:2px;background:var(--surface)}
.list-inline{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
.mobile-bar{display:none}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
@media (max-width:1000px){.tiles{grid-template-columns:repeat(2,1fr)}.two{grid-template-columns:1fr}}
@media (max-width:760px){
  .app{grid-template-columns:1fr}
  aside{display:none}
  main{padding:14px 14px 90px}
  .mobile-bar{display:flex;position:fixed;bottom:0;left:0;right:0;background:var(--surface);border-top:1px solid var(--line);justify-content:space-around;padding:6px 4px;z-index:40}
  .mobile-bar a{display:flex;flex-direction:column;align-items:center;font-size:10.5px;color:var(--ink-2);text-decoration:none;padding:4px 6px;gap:2px}
  .mobile-bar a.active{color:var(--accent)}
  .mobile-bar svg{width:20px;height:20px}
  .brow{grid-template-columns:96px 1fr 84px}
  .form{grid-template-columns:1fr}
  .hide-sm{display:none}
}

/* calendar picker */
.dfield{display:inline-flex}
.form .dfield{display:flex}
.dbtn{display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:7px 10px;min-height:36px;cursor:pointer;font:inherit;color:var(--ink);width:100%;text-align:left;white-space:nowrap}
.dbtn:hover{background:var(--surface-2)}
.dbtn:focus-visible{outline:2px solid var(--accent);outline-offset:-1px}
.dbtn svg{width:16px;height:16px;color:var(--ink-3);flex:none}
.dbtn.none span{color:var(--ink-3)}
#cal{position:fixed;z-index:90;width:292px;background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:0 12px 40px rgba(0,0,0,.28);padding:12px;display:none;color:var(--ink)}
#cal.open{display:block}
.cal-h{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px;gap:6px}
.cal-nav{border:none;background:var(--surface-2);width:32px;height:32px;border-radius:8px;cursor:pointer;font-size:18px;line-height:1;color:var(--ink)}
.cal-nav:hover{background:var(--line)}
.cal-title{border:none;background:transparent;font:inherit;font-weight:600;font-size:14px;padding:6px 10px;border-radius:8px;cursor:pointer;color:var(--ink)}
.cal-title:not(:disabled):hover{background:var(--surface-2)}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;text-align:center}
.cal-grid.g3{grid-template-columns:repeat(3,1fr);gap:6px}
.cal-grid .dow{font-size:11px;color:var(--ink-3);padding:4px 0;font-weight:600}
.cal-day{border:none;background:transparent;border-radius:8px;height:35px;cursor:pointer;font:inherit;font-size:13px;position:relative;color:var(--ink);font-variant-numeric:tabular-nums}
.cal-day.wide{height:42px}
.cal-day:hover{background:var(--surface-2)}
.cal-day.out{color:var(--ink-3)}
.cal-day.today{box-shadow:inset 0 0 0 1.5px var(--accent)}
.cal-day.sel,.cal-day.sel:hover{background:var(--accent);color:#fff}
.cal-day.has::after{content:'';position:absolute;bottom:4px;left:50%;width:4px;height:4px;margin-left:-2px;border-radius:50%;background:var(--accent)}
.cal-day.sel.has::after{background:#fff}
.cal-foot{display:flex;justify-content:space-between;margin-top:8px;padding-top:8px;border-top:1px solid var(--line)}
.cal-foot button{border:none;background:transparent;color:var(--accent);font:inherit;font-size:13px;font-weight:600;cursor:pointer;padding:5px 8px;border-radius:6px}
.cal-foot button:hover{background:var(--accent-soft)}
.cal-t{font-weight:600;margin-bottom:8px;font-size:13px}
.cal-note{font-size:11.5px;color:var(--ink-3);margin-top:8px}
/* member panels */
details.mp{background:var(--surface);border:1px solid var(--line);border-radius:12px;margin-bottom:14px;box-shadow:var(--shadow)}
details.mp>summary{list-style:none;cursor:pointer;padding:14px 18px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
details.mp>summary::-webkit-details-marker{display:none}
details.mp .chev{transition:transform .15s;color:var(--ink-3);width:16px;height:16px;flex:none}
details.mp[open] .chev{transform:rotate(90deg)}
.mp-body{padding:0 18px 18px}
.mp-sum{margin-left:auto;display:flex;gap:16px;flex-wrap:wrap;font-size:12.5px;color:var(--ink-2)}
.mp-sum b{color:var(--ink);font-variant-numeric:tabular-nums}
.avatar{width:36px;height:36px;border-radius:50%;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;font-weight:700;flex:none}
.mstats{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;margin-bottom:14px}
.mstat{background:var(--surface-2);border-radius:10px;padding:10px 12px}
.mstat .lbl{font-size:12px;color:var(--ink-2)}
.mstat .val{font-size:17px;font-weight:700;font-variant-numeric:tabular-nums}
.mp .card{box-shadow:none;background:var(--bg)}
.mp-head{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
@media (max-width:1000px){.mstats{grid-template-columns:repeat(2,1fr)}}
</style>
</head>
<body>
<div class="app">
  <aside>
    <div class="brand"><div class="logo">₹</div>Family Expenses</div>
    <nav id="nav"></nav>
    <div class="whoami" id="whoami">Connecting…</div>
  </aside>
  <main id="main">
    <div class="empty">Loading your expense tracker…</div>
  </main>
</div>
<div class="mobile-bar" id="mnav"></div>

<div class="scrim" id="scrim"><div class="modal" id="modal" role="dialog" aria-modal="true"></div></div>
<div class="toast" id="toast"></div>
<div id="tip"></div>
<div id="cal" role="dialog" aria-label="Calendar"></div>

<script>
/* ============ helpers ============ */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
const pad = n => String(n).padStart(2, '0');
const isoDate = d => d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
const todayISO = () => isoDate(new Date());
const ymOf = iso => iso.slice(0, 7);
const parseISO = s => { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d); };
const MONTHS = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const fmtDate = iso => { const d = parseISO(iso); return d.getDate() + ' ' + MONTHS[d.getMonth()] + ' ' + d.getFullYear(); };
let CUR = '₹';
const money = (n, short) => {
  const v = Math.round((n || 0) * 100) / 100;
  if (short && Math.abs(v) >= 100000) return CUR + (v / 100000).toFixed(1).replace(/\.0$/, '') + 'L';
  if (short && Math.abs(v) >= 1000) return CUR + (v / 1000).toFixed(1).replace(/\.0$/, '') + 'k';
  return CUR + v.toLocaleString('en-IN', { maximumFractionDigits: 2 });
};
function toast(msg) { const t = $('#toast'); t.textContent = msg; t.classList.add('show'); clearTimeout(toast._t); toast._t = setTimeout(() => t.classList.remove('show'), 2600); }
const tip = $('#tip');
function showTip(e, html) { tip.innerHTML = html; tip.style.opacity = 1; const x = Math.min(e.clientX + 14, innerWidth - tip.offsetWidth - 8); tip.style.left = x + 'px'; tip.style.top = (e.clientY - tip.offsetHeight - 10) + 'px'; }
function hideTip() { tip.style.opacity = 0; }

/* ============ defaults (used until the admin saves settings) ============ */
const PALETTE = ['#2a78d6','#eb6834','#1baf7a','#eda100','#e87ba4','#008300','#6250d6','#e34948','#7a7a74','#256abf','#d95926','#199e70'];
const DEFAULT_CONFIG = {
  currency: '₹',
  monthStartDay: 1,
  categories: [
    { id: 'food', name: 'Food & Groceries', color: PALETTE[0], subs: ['Groceries', 'Vegetables', 'Hotel', 'Snacks'] },
    { id: 'home', name: 'Rent & Home', color: PALETTE[1], subs: ['Rent', 'Maintenance', 'Furniture'] },
    { id: 'bills', name: 'Bills & Utilities', color: PALETTE[2], subs: ['EB Bill', 'Water', 'Internet', 'Mobile recharge', 'Gas'] },
    { id: 'travel', name: 'Transport', color: PALETTE[3], subs: ['Fuel', 'Bus / Train', 'Cab / Auto', 'Vehicle service'] },
    { id: 'shop', name: 'Shopping', color: PALETTE[4], subs: ['Clothes', 'Electronics', 'Online'] },
    { id: 'health', name: 'Health', color: PALETTE[5], subs: ['Medicines', 'Doctor', 'Insurance'] },
    { id: 'edu', name: 'Education', color: PALETTE[6], subs: ['School fees', 'Books', 'Courses'] },
    { id: 'emi', name: 'EMI & Loans', color: PALETTE[7], subs: [] },
    { id: 'fun', name: 'Entertainment', color: PALETTE[8], subs: ['Movies', 'Subscriptions', 'Outings'] },
    { id: 'other', name: 'Others', color: '#9a9992', subs: [] },
  ],
  incomeCategories: ['Salary', 'Business', 'Interest', 'Gift', 'Other income'],
  savingCategories: ['SIP / Mutual fund', 'RD', 'Chit fund', 'FD', 'PPF / EPF', 'Gold', 'Stocks', 'Other savings'],
  modes: ['Cash', 'UPI', 'Debit card', 'Credit card', 'Bank transfer'],
  budgets: {},           // household budgets by category id
  householdTotal: 0,     // household monthly budget
};

/* ============ state ============ */
const S = {
  me: null, meUser: null, isAdmin: false, canWrite: true,
  config: structuredClone(DEFAULT_CONFIG),
  members: {}, names: {}, entries: [], budgets: {}, recurring: {},
  loaded: false, stale: false, loadError: '', lastLoad: 0,
  view: 'dashboard',
  f: { scope: 'me', period: 'this', from: '', to: '', cat: '', mode: '', type: '', q: '', rwho: 'me' },
  mpOpen: {},
};
const HH = 'household';

/* ============ server API ============ */
async function api(method, path, body) {
  const headers = {};
  if (method !== 'GET') headers['X-Requested-With'] = 'fetch';
  if (body !== undefined) headers['Content-Type'] = 'application/json';
  let r;
  try { r = await fetch(path, { method, headers, credentials: 'same-origin', body: body !== undefined ? JSON.stringify(body) : undefined }); }
  catch (e) { throw new Error("Can't reach the server. Check your internet connection."); }
  let d = {}; try { d = await r.json(); } catch (e) {}
  if (r.status === 401) { location.replace('/login.html'); throw new Error('Please log in.'); }
  if (!r.ok) throw new Error(d.error || 'Something went wrong. Please try again.');
  return d;
}
let loading = null;
function load() {
  if (loading) return loading;
  loading = (async () => {
    try {
      const d = await api('GET', '/api/bootstrap');
      S.meUser = d.me; S.me = d.me.id;
      S.isAdmin = d.me.role === 'admin'; S.canWrite = d.me.role !== 'viewer';
      if (!S.canWrite) S.f.scope = HH;
      S.config = { ...structuredClone(DEFAULT_CONFIG), ...d.config };
      CUR = S.config.currency || '₹';
      S.members = {}; S.names = {};
      (d.users || []).forEach(u => { S.members[u.id] = u; S.names[u.id] = u.name; });
      S.entries = d.entries || [];
      S.budgets = d.budgets || {};
      S.recurring = {}; (d.recurring || []).forEach(r => { S.recurring[r.id] = r; });
      S.loaded = true; S.stale = false; S.lastLoad = Date.now();
      if (S.meUser.mustChangePassword && S.view !== 'account') { location.hash = 'account'; }
      if (!S.routed) { S.routed = true; route(); } else render();   // first load: re-check the URL now that we know the role (deep links to #family etc.)
    } catch (e) {
      if (e.message !== 'Please log in.') { S.stale = true; S.loadError = e.message; render(); }
    } finally { loading = null; }
  })();
  return loading;
}
async function mutate(method, path, body) { const d = await api(method, path, body); await load(); return d; }

/* ============ boot ============ */
function boot() {
  window.addEventListener('hashchange', route);
  route();
  load();
  window.addEventListener('focus', () => { if (Date.now() - S.lastLoad > 30000) load(); });
  setInterval(() => { if (document.visibilityState === 'visible') load(); }, 120000);
}

function allItems(owner) { return S.entries.filter(e => e.owner === owner); }
function scopeItems(scope) {
  if (scope === 'me') return allItems(S.me);
  if (scope === 'all') return S.entries.slice();
  return allItems(scope);
}
function scopeLabel(scope) {
  if (scope === 'me') return 'My expenses';

function monthRange(offset) {

  if (p === '6m') return [monthRange(-5)[0], monthRange(0)[1]];

  if (p === 'fy') { const y = now.getMonth() >= 3 ? now.getFullYear() : now.getFullYear() - 1; return [new Date(y, 3, 1), new Date(y + 1, 3, 1)]; }
  if (p === 'today') { const s = new Date(now.getFullYear(), now.getMonth(), now.getDate()); return [s, new Date(s.getTime() + 864e5)]; }
  if (p === 'week') { const s = new Date(now.getFullYear(), now.getMonth(), now.getDate() - ((now.getDay() + 6) % 7)); return [s, new Date(s.getTime() + 7 * 864e5)]; }

    const s = S.f.from ? parseISO(S.f.from) : new Date(2000, 0, 1);
    const e = S.f.to ? new Date(parseISO(S.f.to).getTime() + 864e5) : new Date(2100, 0, 1);

}
function prevRange([s, e]) { const len = e - s; return [new Date(s - len), s]; }
const inRange = (it, [s, e]) => { const d = parseISO(it.date); return d >= s && d < e; };

/* ============ calendar picker ============ */
const DOW = ['Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat', 'Sun'];
const FULL_MONTHS = ['January', 'February', 'March', 'April', 'May', 'June', 'July', 'August', 'September', 'October', 'November', 'December'];

function closeCal() { CAL.open = false; $('#cal').classList.remove('open'); }
function openCal(btn) {

  CAL.btn = btn; CAL.input = document.getElementById(btn.dataset.for); CAL.mode = btn.dataset.cal;
  const v = CAL.input.value, now = new Date();

}
function drawCal() {
  const el = $('#cal'); el.classList.add('open');

  const foot = (todayLabel) => `<div class="cal-foot"><button type="button" data-today="1">${todayLabel}</button>${CAL.btn.dataset.clear ? '<button type="button" data-clear="1">Clear</button>' : ''}</div>`;
  if (CAL.mode === 'dom') {
    h = `<div class="cal-t">Day of the month</div><div class="cal-grid">${Array.from({ length: 31 }, (_, i) => i + 1).map(d => `<button type="button" class="cal-day${+v === d ? ' sel' : ''}" data-pick="${d}">${d}</button>`).join('')}</div><div class="cal-note">In shorter months it's added on the last day.</div>`;
  } else if (CAL.view === 'months') {
    h = `<div class="cal-h"><button type="button" class="cal-nav" data-nav="-12" aria-label="Previous year">‹</button><button type="button" class="cal-title" disabled>${CAL.y}</button><button type="button" class="cal-nav" data-nav="12" aria-label="Next year">›</button></div>
      <div class="cal-grid g3">${MONTHS.map((n, i) => { const ym = CAL.y + '-' + pad(i + 1); return `<button type="button" class="cal-day wide${v === ym ? ' sel' : ''}${today.slice(0, 7) === ym ? ' today' : ''}" data-pickm="${i}">${n}</button>`; }).join('')}</div>${CAL.mode === 'month' ? foot('This month') : ''}`;

function groupBy(items, key) { const m = {}; items.forEach(i => { const k = typeof key === 'function' ? key(i) : i[key]; m[k] = (m[k] || 0) + (+i.amount || 0); }); return m; }

function barList(rows, opts = {}) {
  // rows: [{label, color, value, budget, sub}]
  if (!rows.length) return `<div class="empty">No entries in this period.</div>`;
  const max = Math.max(...rows.map(r => Math.max(r.value, r.budget || 0)), 1);
  return `<div class="barlist">${rows.map(r => {
    const pct = r.value / max * 100;
    const bpct = r.budget ? r.budget / max * 100 : null;
    const share = opts.total ? Math.round(r.value / opts.total * 100) + '%' : '';
    const tipTxt = `<b>${esc(r.label)}</b>${money(r.value)}${share ? ' · ' + share + ' of total' : ''}${r.budget ? '<br>Budget ' + money(r.budget) : ''}`;
    return `<div class="brow" data-tip="${esc(tipTxt)}"><div class="name"><span class="dot" style="background:${esc(r.color)}"></span>${esc(r.label)}</div>
      <div class="track"><div class="fill" style="width:${pct}%;background:${esc(r.color)}"></div>${bpct != null ? `<div class="budget-mark" style="left:calc(${bpct}% - 1px)" title="Budget"></div>` : ''}</div>
      <div class="amt">${money(r.value)}${r.sub ? `<small>${r.sub}</small>` : share ? `<small>${share}</small>` : ''}</div></div>`;

function trendChart(items) {
  // last 6 budget-months, expense totals
  const bars = [];
  for (let k = -5; k <= 0; k++) {
    const r = monthRange(k);
    const v = sum(items.filter(i => inRange(i, r)));
    const inc = sum(items.filter(i => inRange(i, r)), 'income');
    bars.push({ label: MONTHS[r[0].getMonth()] + (r[0].getMonth() === 0 ? " '" + String(r[0].getFullYear()).slice(2) : ''), v, inc, cur: k === 0, range: r });
  }
  const W = 560, H = 220, L = 46, R = 8, T = 12, B = 26;

  const y = v => T + (H - T - B) * (1 - v / max);
  let g = '';

  const marks = bars.map((b, i) => {
    const x = L + bw * i + (bw - barW) / 2; const yy = y(b.v); const h = Math.max(H - B - yy, b.v > 0 ? 2 : 0);
    const r = Math.min(4, h);
    const path = h > 0 ? `M${x},${H - B} V${yy + r} Q${x},${yy} ${x + r},${yy} H${x + barW - r} Q${x + barW},${yy} ${x + barW},${yy + r} V${H - B} Z` : '';
    const t = `<b>${esc(b.label)}${b.cur ? ' (current)' : ''}</b>Spent ${money(b.v)}${b.inc ? '<br>Income ' + money(b.inc) : ''}`;
    return `<g data-tip="${esc(t)}"><rect class="hit" x="${L + bw * i}" y="${T}" width="${bw}" height="${H - T - B}"/>${path ? `<path class="bar" d="${path}" style="opacity:${b.cur ? 1 : .55}"/>` : ''}<text x="${x + barW / 2}" y="${H - 8}" text-anchor="middle">${esc(b.label)}</text></g>`;
  }).join('');
  return `<div class="trend"><svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" role="img" aria-label="Spending over the last 6 months"><g class="axis">${g}${marks}</g></svg></div>
  <table class="sr"><tr><th>Month</th><th>Spent</th></tr>${bars.map(b => `<tr><td>${b.label}</td><td>${money(b.v)}</td></tr>`).join('')}</table>`;
}
function niceMax(v) { const st = v / 4; const p = Math.pow(10, Math.floor(Math.log10(st))); const n = st / p; return (n <= 1 ? 1 : n <= 2 ? 2 : n <= 2.5 ? 2.5 : n <= 5 ? 5 : 10) * p * 4; }

function budgetFor(scope) {

  return `<table><tbody>
    ${row('<span class="pill"><span class="dot" style="background:var(--good)"></span>Income</span>', money(income), { bold: true })}

function viewBudgets() {

function viewRecurring() {
  const who = S.isAdmin ? S.f.rwho : null;
  const rules = Object.entries(S.recurring).filter(([, r]) => r && !r.deleted && (!who || who === 'all' || r.owner === (who === 'me' ? S.me : who))).map(([id, r]) => [id, r, ruleProgress(id, r)]);
  const whoSel = S.isAdmin ? `<div class="filters"><select data-f="rwho" aria-label="Whose recurring entries"><option value="me" ${who === 'me' ? 'selected' : ''}>My entries</option>${Object.keys(S.members).filter(i => i !== S.me && S.members[i].active !== false).map(i => `<option value="${esc(i)}" ${who === i ? 'selected' : ''}>${esc(nameOf(i))}</option>`).join('')}<option value="all" ${who === 'all' ? 'selected' : ''}>Everyone</option></select></div>` : '';
  const active = rules.filter(([, r, p]) => !r.paused && !p.done);
  const out = active.filter(([, r]) => typeOf(r) !== 'income').reduce((a, [, r]) => a + r.amount, 0);
  const inc = active.filter(([, r]) => typeOf(r) === 'income').reduce((a, [, r]) => a + r.amount, 0);
  const group = (title, list) => !list.length ? '' : `<h2 style="margin:18px 0 8px">${title}</h2><div class="card" style="padding:6px 8px"><div class="tablewrap"><table><thead><tr><th>What</th><th class="hide-sm">Day</th><th>Progress</th><th class="num hide-sm">Total so far</th><th class="num hide-sm">Remaining</th><th class="num">Per month</th><th></th></tr></thead><tbody>
  ${list.map(([id, r, p]) => `<tr style="${r.paused || p.done ? 'opacity:.6' : ''}"><td><span class="pill"><span class="dot" style="background:${entryColor(r)}"></span>${esc(r.note || entryLabel(r))}</span><div class="sub">${esc(entryLabel(r))} · ${r.target === HH ? 'Household' : (r.owner === S.me ? 'Me' : esc(rawName(r.owner)))}${r.target === HH && r.owner !== S.me ? ' · added by ' + esc(rawName(r.owner)) : ''}${r.paused ? ' · paused' : ''}${r.maturity ? ' · value ' + money(r.maturity) : ''}</div></td>
    <td class="hide-sm">${esc(r.day)}</td>
    <td style="min-width:150px">${p.done ? '<span class="status ok">✓ Completed</span>' : p.n ? `${p.paid} of ${p.n} · ends ${ymLabel(p.endYm)}<div class="track" style="height:6px;margin-top:5px"><div class="fill" style="width:${Math.min(100, p.paid / p.n * 100)}%;background:${entryColor(r)}"></div></div>` : `${p.paid} months · no end`}</td>
    <td class="num hide-sm">${money(p.paidSum)}</td><td class="num hide-sm">${p.n ? money(p.leftSum) + `<div class="sub">${p.left} month${p.left === 1 ? '' : 's'}</div>` : '—'}</td>
    <td class="num" style="font-weight:600">${money(r.amount)}</td>
    <td class="num">${S.canWrite && r.owner === S.me ? `<button class="btn small ghost" data-act="editrec" data-id="${esc(id)}">Edit</button><button class="btn small ghost" data-act="pauserec" data-id="${esc(id)}">${r.paused ? 'Resume' : 'Pause'}</button><button class="btn small ghost danger" data-act="delrec" data-id="${esc(id)}">Delete</button>` : ''}</td></tr>`).join('')}
  </tbody></table></div></div>`;
  return `<div class="top"><div><h1>Recurring, EMI & savings</h1><div class="sub">Added automatically every month on the chosen day. Set the number of months to track how many are paid and left.</div></div>${S.canWrite ? '<button class="btn primary" data-act="addrec">+ New recurring</button>' : ''}</div>
  ${whoSel}
  ${rules.length ? `<div class="grid tiles" style="grid-template-columns:repeat(3,1fr)">
    <div class="card tile"><div class="lbl">Going out every month</div><div class="val">${money(out)}</div><div class="meta">EMI, bills, SIP, RD, chit…</div></div>
    <div class="card tile"><div class="lbl">Coming in every month</div><div class="val">${money(inc)}</div><div class="meta">recurring income</div></div>
    <div class="card tile"><div class="lbl">Left after commitments</div><div class="val ${inc - out < 0 ? 'up' : ''}">${money(inc - out)}</div><div class="meta">before day-to-day spending</div></div></div>
  ${group('EMI, rent & bills', rules.filter(([, r]) => typeOf(r) === 'expense'))}
  ${group('Savings & investments', rules.filter(([, r]) => typeOf(r) === 'saving'))}
  ${group('Income', rules.filter(([, r]) => typeOf(r) === 'income'))}`
  : `<div class="card"><div class="empty">${who && who !== 'me' ? 'Nothing set up here yet.' : 'No recurring entries yet. Add your EMI, SIP, RD, chit, rent or salary.'}</div></div>`}`;
}

function userForm(id, resetOnly) {

    <label>Relationship<input type="text" id="u-rel" list="rel-list" value="${esc(u.relationship || '')}" placeholder="e.g. Wife, Son, Mother"><datalist id="rel-list">${REL_OPTIONS.map(o => `<option value="${esc(o)}">`).join('')}</datalist></label>

    <label class="full">Role<select id="u-role" ${id === S.me ? 'disabled' : ''}>
      <option value="member" ${u.role === 'member' ? 'selected' : ''}>Member — own expenses + household</option>
      <option value="viewer" ${u.role === 'viewer' ? 'selected' : ''}>Viewer — household only, read-only</option>
      <option value="admin" ${u.role === 'admin' ? 'selected' : ''}>Admin — sees everything</option></select></label>
    ${id ? (id !== S.me ? `<label class="full" style="flex-direction:row;align-items:center;gap:8px"><input type="checkbox" id="u-active" ${u.active !== false ? 'checked' : ''} style="width:auto;min-height:0"> Account active (can log in)</label>` : '') : pwHtml}`}
  </div><div class="err" id="u-err"></div>
  <div class="actions"><button class="btn" data-x="no">Cancel</button><button class="btn primary" data-x="yes">${resetOnly ? 'Reset password' : id ? 'Save' : 'Add member'}</button></div>`, m => {
    m.querySelector('[data-x=no]').onclick = closeModal;
    m.querySelector('[data-x=yes]').onclick = async () => {
      const err = m.querySelector('#u-err'); err.textContent = '';
      const pw = m.querySelector('#u-pw')?.value;
      try {
        if (resetOnly) { await mutate('PUT', '/api/users/' + id, { password: pw }); closeModal(); showCredentials(u.name, u.username, pw, true); return; }
        const body = { name: m.querySelector('#u-name').value.trim(), relationship: m.querySelector('#u-rel').value.trim(), role: m.querySelector('#u-role').value };
        if (id) { const a = m.querySelector('#u-active'); if (a) body.active = a.checked; await mutate('PUT', '/api/users/' + id, body); closeModal(); toast('Saved'); }
        else { body.username = m.querySelector('#u-user').value.trim(); body.password = pw; await mutate('POST', '/api/users', body); closeModal(); showCredentials(body.name, body.username, pw, false); }
      } catch (e) { err.textContent = e.message; }
    };
  });
}
function tempPassword() {
  const words = ['Mango', 'Lotus', 'River', 'Tiger', 'Coral', 'Cedar', 'Pearl', 'Maple', 'Jasmine', 'Comet'];
  const a = new Uint32Array(2); crypto.getRandomValues(a);
  return words[a[0] % words.length] + '-' + String(1000 + a[1] % 9000);
}
function showCredentials(name, username, pw, reset) {
  const text = `Family Expense Tracker\nWebsite: ${location.origin}\nUsername: ${username}\nTemporary password: ${pw}\nYou'll be asked to set your own password when you log in.`;
  openModal(`<h2>${reset ? 'Password reset' : esc(name) + ' added'}</h2>
  <p class="sub">Send these login details to ${esc(name)}. The temporary password won't be shown again.</p>
  <pre style="background:var(--surface-2);padding:12px;border-radius:8px;white-space:pre-wrap;font-size:13px">${esc(text)}</pre>
  <div class="actions"><button class="btn" data-x="copy">Copy</button><button class="btn primary" data-x="ok">Done</button></div>`, m => {
    m.querySelector('[data-x=ok]').onclick = closeModal;
    m.querySelector('[data-x=copy]').onclick = async () => { try { await navigator.clipboard.writeText(text); toast('Copied'); } catch (e) { toast('Select the text and copy it'); } };
  });
}

function openModal(html, onBind) { $('#modal').innerHTML = html; $('#scrim').classList.add('open'); onBind && onBind($('#modal')); const f = $('#modal').querySelector('input:not([type=hidden]),select'); f && f.focus(); }
function closeModal() { $('#scrim').classList.remove('open'); $('#modal').innerHTML = ''; }
$('#scrim').addEventListener('click', e => { if (e.target.id === 'scrim') closeModal(); });
document.addEventListener('keydown', e => { if (e.key === 'Escape') { if (CAL.open) { closeCal(); return; } closeModal(); } });

function findItem(owner, id) { return allItems(owner).find(i => i.id === id); }
function quickPicks() {
  const seen = new Map();
  [...allItems(S.me), ...allItems(HH)].filter(i => (i.type || 'expense') === 'expense' && !i.recurring).sort((a, b) => (b.created || 0) - (a.created || 0)).forEach(i => {
    const k = i.cat + '|' + (i.sub || '') + '|' + (i.note || '') + '|' + i.amount;
    if (!seen.has(k) && seen.size < 6) seen.set(k, i);
  });
  return [...seen.values()];
}

    <label>Date${dateField('e-date', it.date, { label: 'Entry date' })}</label>
    <label id="l-cat">Category<select id="e-cat"></select></label>
    <label id="l-sub">Sub-category<input type="text" id="e-sub" list="e-subs" value="${esc(it.sub || '')}" placeholder="optional"><datalist id="e-subs"></datalist></label>
    <label>Payment mode<select id="e-mode">${S.config.modes.map(m => `<option ${it.mode === m ? 'selected' : ''}>${esc(m)}</option>`).join('')}<option value="" ${!it.mode ? 'selected' : ''}>Not set</option></select></label>
    <label>Tags<input type="text" id="e-tags" value="${esc((it.tags || []).join(', '))}" placeholder="e.g. ooty-trip, diwali"></label>
    <label class="full">Note<input type="text" id="e-note" value="${esc(it.note || '')}" placeholder="What was it for?"></label>
  </form>
  <div class="err" id="e-err"></div>
  <div class="actions"><button class="btn" data-x="cancel">Cancel</button><button class="btn primary" data-x="save">${existing ? 'Save changes' : 'Add entry'}</button></div>`;
  openModal(html, m => {
    let owner = it.owner;
    const setSeg = (id, v) => m.querySelectorAll('#' + id + ' button').forEach(b => b.classList.toggle('on', b.dataset.v === v));
    const fillCats = () => {
      const sel = m.querySelector('#e-cat');
      sel.innerHTML = typeCats(type).map(c => `<option value="${esc(c.v)}" ${it.cat === c.v ? 'selected' : ''}>${esc(c.l)}</option>`).join('');
      m.querySelector('#l-sub').style.display = type === 'expense' ? '' : 'none';
      fillSubs();
    };
    const fillSubs = () => { const c = catById(m.querySelector('#e-cat').value); m.querySelector('#e-subs').innerHTML = (c.subs || []).map(s => `<option value="${esc(s)}">`).join(''); };
    setSeg('e-type', type); setSeg('e-owner', owner); fillCats();
    m.querySelectorAll('#e-type button').forEach(b => b.onclick = () => { type = b.dataset.v; setSeg('e-type', type); fillCats(); });
    m.querySelectorAll('#e-owner button').forEach(b => b.onclick = () => { owner = b.dataset.v; setSeg('e-owner', owner); });
    m.querySelector('#e-cat').onchange = fillSubs;
    m.querySelectorAll('[data-pick]').forEach(b => b.onclick = () => {
      const p = picks[+b.dataset.pick];
      m.querySelector('#e-amt').value = p.amount; m.querySelector('#e-cat').value = p.cat; fillSubs();
      m.querySelector('#e-sub').value = p.sub || ''; m.querySelector('#e-mode').value = p.mode || ''; m.querySelector('#e-note').value = p.note || '';
      m.querySelector('#e-tags').value = (p.tags || []).join(', ');
      owner = p.owner; setSeg('e-owner', owner);
    });
    m.querySelector('[data-x=cancel]').onclick = closeModal;
    const save = async () => {
      const amt = parseFloat(m.querySelector('#e-amt').value); const date = m.querySelector('#e-date').value;
      const err = m.querySelector('#e-err');
      if (!(amt > 0)) { err.textContent = 'Enter an amount greater than zero.'; return; }
      if (!date) { err.textContent = 'Pick a date.'; return; }
      const item = {
        id: existing ? existing.id : uid(), date, amount: amt, type,
        cat: m.querySelector('#e-cat').value, sub: type === 'expense' ? m.querySelector('#e-sub').value.trim() : '',
        mode: m.querySelector('#e-mode').value, note: m.querySelector('#e-note').value.trim(),
        tags: m.querySelector('#e-tags').value.split(',').map(t => t.trim().replace(/^#/, '')).filter(Boolean),
        by: existing?.by || S.me, created: existing?.created || Date.now(), edited: existing ? Date.now() : null,
      };
      if (existing?.recurring) item.recurring = existing.recurring;
      const btn = m.querySelector('[data-x=save]'); btn.disabled = true; btn.textContent = 'Saving…';
      try {
        if (existing) await mutate('PUT', '/api/entries/' + existing.id, item);
        else await mutate('POST', '/api/entries', { ...item, owner });
        closeModal(); toast(existing ? 'Entry updated' : 'Entry added');
      } catch (e) { btn.disabled = false; btn.textContent = 'Try again'; err.textContent = writeError(e); }
    };
    m.querySelector('[data-x=save]').onclick = save;
    m.querySelector('#e-form').onsubmit = e => { e.preventDefault(); save(); };
    m.querySelectorAll('#e-form input').forEach(i => i.addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); save(); } }));
  });
}
function writeError(e) { return (e && e.message) || 'Could not save right now. Please try again.'; }

function confirmBox(title, msg, okLabel, fn) {
  openModal(`<h2>${esc(title)}</h2><p class="sub">${msg}</p><div class="err" id="c-err"></div><div class="actions"><button class="btn" data-x="no">Cancel</button><button class="btn primary" data-x="yes" style="background:var(--crit);border-color:var(--crit)">${esc(okLabel)}</button></div>`, m => {
    m.querySelector('[data-x=no]').onclick = closeModal;
    m.querySelector('[data-x=yes]').onclick = async () => { try { await fn(); closeModal(); } catch (e) { m.querySelector('#c-err').textContent = writeError(e); } };
  });
}

function budgetForm(key) {
  const b = budgetFor(key);
  openModal(`<h2>${key === HH ? 'Household' : key === 'me' ? 'My' : esc(rawName(key)) + "'s"} monthly budgets</h2>
  <div class="form"><label class="full">Overall monthly budget (${esc(CUR)})<input type="number" id="b-total" min="0" value="${esc(b.total || '')}" placeholder="No limit"></label>
  ${S.config.categories.map(c => `<label><span class="pill"><span class="dot" style="background:${esc(c.color)}"></span>${esc(c.name)}</span><input type="number" min="0" data-bc="${esc(c.id)}" value="${esc(b.budgets[c.id] || '')}" placeholder="No limit"></label>`).join('')}</div>
  <div class="err" id="b-err"></div><div class="actions"><button class="btn" data-x="no">Cancel</button><button class="btn primary" data-x="yes">Save budgets</button></div>`, m => {
    m.querySelector('[data-x=no]').onclick = closeModal;
    m.querySelector('[data-x=yes]').onclick = async () => {
      const budgets = {}; m.querySelectorAll('[data-bc]').forEach(i => { const v = parseFloat(i.value); if (v > 0) budgets[i.dataset.bc] = v; });
      const total = parseFloat(m.querySelector('#b-total').value) || 0;
      try {
        await mutate('PUT', '/api/budgets/' + key, { budgets, total });
        closeModal(); toast('Budgets saved');
      } catch (e) { m.querySelector('#b-err').textContent = writeError(e); }
    };
  });
}
async function saveConfig(cfg) { await mutate('PUT', '/api/settings', cfg); }

function recForm(id) {
  const r = id ? S.recurring[id] : { type: 'expense', day: new Date().getDate(), cat: S.config.categories[0]?.id, mode: S.config.modes[0] || '', target: S.me, startYm: todayISO().slice(0, 7) };
  let type = r.type || 'expense';
  openModal(`<h2>${id ? 'Edit' : 'New'} recurring entry</h2><p class="sub" style="margin-top:-6px">For EMI, SIP, RD, chit, rent, subscriptions or salary.</p>
  <div style="display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px"><div class="seg" id="r-type"><button data-v="expense">Expense / EMI</button><button data-v="saving">Savings</button><button data-v="income">Income</button></div>
  <div class="seg" id="r-target"><button data-v="me">Just me</button><button data-v="household">Household</button></div></div>
  <div class="form">
    <label>Amount (${esc(CUR)})<input type="number" id="r-amt" min="0" step="0.01" value="${esc(r.amount ?? '')}"></label>
    <label>Day of month${dateField('r-day', r.day, { mode: 'dom', label: 'Day of month' })}</label>
    <label>Category<select id="r-cat"></select></label>
    <label>Payment mode<select id="r-mode">${S.config.modes.map(m => `<option ${r.mode === m ? 'selected' : ''}>${esc(m)}</option>`).join('')}</select></label>
    <label class="full">Name<input type="text" id="r-note" value="${esc(r.note || '')}" placeholder="e.g. Car EMI, SIP – Axis Bluechip, Chit ₹1 lakh, RD – SBI"></label>
    <label>Number of months (optional)<input type="number" id="r-inst" min="1" max="600" value="${esc(r.installments || '')}" placeholder="e.g. 24"><span class="sub" style="font-weight:400">Tenure — stops automatically after this.</span></label>
    <label>Maturity / chit value (optional)<input type="number" id="r-mat" min="0" value="${esc(r.maturity || '')}" placeholder="e.g. 100000"></label>
    ${id ? '' : `<label class="full">Start from month${dateField('r-start', r.startYm, { mode: 'month', label: 'Start month' })}<span class="sub" style="font-weight:400">Past months from here are filled in automatically.</span></label>`}
  </div><div class="err" id="r-err"></div>
  <div class="actions"><button class="btn" data-x="no">Cancel</button><button class="btn primary" data-x="yes">Save</button></div>`, m => {
    let target = r.target === HH ? 'household' : 'me';
    const seg = (sid, v) => m.querySelectorAll('#' + sid + ' button').forEach(b => b.classList.toggle('on', b.dataset.v === v));
    const fill = () => { m.querySelector('#r-cat').innerHTML = typeCats(type).map(c => `<option value="${esc(c.v)}" ${r.cat === c.v ? 'selected' : ''}>${esc(c.l)}</option>`).join(''); };
    seg('r-type', type); seg('r-target', target); fill();
    m.querySelectorAll('#r-type button').forEach(b => b.onclick = () => { type = b.dataset.v; seg('r-type', type); fill(); });
    m.querySelectorAll('#r-target button').forEach(b => b.onclick = () => { target = b.dataset.v; seg('r-target', target); });
    m.querySelector('[data-x=no]').onclick = closeModal;
    m.querySelector('[data-x=yes]').onclick = async () => {
      const amount = parseFloat(m.querySelector('#r-amt').value); const day = parseInt(m.querySelector('#r-day').value, 10);
      if (!(amount > 0)) { m.querySelector('#r-err').textContent = 'Enter an amount.'; return; }
      if (!(day >= 1 && day <= 31)) { m.querySelector('#r-err').textContent = 'Day must be 1–31.'; return; }
      const rid = id || uid();
      const rule = { ...(id ? r : {}), type, amount, day, cat: m.querySelector('#r-cat').value, mode: m.querySelector('#r-mode').value, note: m.querySelector('#r-note').value.trim(), target: target === 'household' ? HH : 'me', installments: parseInt(m.querySelector('#r-inst').value, 10) || null, maturity: parseFloat(m.querySelector('#r-mat').value) || null };
      if (!id) { rule.startYm = m.querySelector('#r-start').value || todayISO().slice(0, 7); rule.lastPosted = ''; }
      try { if (id) await mutate('PUT', '/api/recurring/' + id, rule); else await mutate('POST', '/api/recurring', rule); closeModal(); toast('Recurring entry saved'); }
      catch (e) { m.querySelector('#r-err').textContent = writeError(e); }
    };
  });
}

/* ============ actions ============ */
const ACTIONS = {
  add: () => entryForm(null),
  edit: el => { const it = findItem(el.dataset.owner, el.dataset.id); it && entryForm(it); },
  del: el => { const it = findItem(el.dataset.owner, el.dataset.id); if (!it) return; confirmBox('Delete this entry?', `${esc(fmtDate(it.date))} · ${esc(it.note || catById(it.cat).name)} · <b>${money(it.amount)}</b>`, 'Delete', async () => { await mutate('DELETE', '/api/entries/' + it.id); toast('Entry deleted'); }); },
  openperson: el => { S.f.scope = el.dataset.id === S.me ? 'me' : el.dataset.id; location.hash = el.dataset.to || 'dashboard'; },
  jump: el => { const d = document.getElementById('mp-' + el.dataset.id); if (d) { d.open = true; S.mpOpen[el.dataset.id] = true; d.scrollIntoView({ behavior: 'smooth', block: 'start' }); } },
  backup: async el => {
    el.disabled = true;
    try {
      const r = await fetch('/api/backup', { credentials: 'same-origin' });
      if (!r.ok) throw new Error('Could not create the backup.');
      const url = URL.createObjectURL(await r.blob());
      const a = document.createElement('a'); a.href = url; a.download = 'expense-tracker-backup-' + todayISO() + '.json'; document.body.appendChild(a); a.click(); a.remove();
      setTimeout(() => URL.revokeObjectURL(url), 2000); toast('Backup downloaded');
    } catch (e) { toast(e.message); }
    el.disabled = false;
  },
  viewperson: el => { S.f.scope = el.dataset.id === S.me ? 'me' : el.dataset.id; location.hash = 'transactions'; },
  editbudget: el => budgetForm(el.dataset.key),
  addrec: () => recForm(null),
  editrec: el => recForm(el.dataset.id),
  pauserec: async el => { const r = S.recurring[el.dataset.id]; try { await mutate('PUT', '/api/recurring/' + el.dataset.id, { paused: !r.paused }); } catch (e) { toast(writeError(e)); } },
  delrec: el => confirmBox('Delete this recurring entry?', 'Entries already added stay in your history. Future months won\'t be added.', 'Delete', () => mutate('DELETE', '/api/recurring/' + el.dataset.id)),
  theme: el => { const t = el.dataset.t; if (t === 'auto') delete document.documentElement.dataset.theme; else document.documentElement.dataset.theme = t; try { localStorage.setItem('et-theme', t); } catch (e) {} S.force = true; collectCats(); render(); },
  addcat: () => { collectCats(); S.config.categories.push({ id: 'c' + uid().slice(-6), name: 'New category', color: PALETTE[S.config.categories.length % PALETTE.length], subs: [] }); S.dirty = true; S.force = true; render(); },
  delcat: el => { collectCats(); S.config.categories.splice(+el.dataset.i, 1); S.dirty = true; S.force = true; render(); },
  savesettings: async el => {
    collectCats();
    const cfg = { ...S.config,
      modes: $('#set-modes').value.split(',').map(s => s.trim()).filter(Boolean),
      incomeCategories: $('#set-inc').value.split(',').map(s => s.trim()).filter(Boolean),
      savingCategories: $('#set-sav').value.split(',').map(s => s.trim()).filter(Boolean),
      currency: $('#set-cur').value.trim() || '₹',
      monthStartDay: Math.min(28, Math.max(1, parseInt($('#set-start').value, 10) || 1)) };
    if (!cfg.categories.length) { toast('Keep at least one category'); return; }
    el.disabled = true;
    try { await saveConfig(cfg); S.dirty = false; S.force = true; render(); toast('Settings saved for everyone'); } catch (e) { toast(writeError(e)); }
    el.disabled = false;
  },
  adduser: () => userForm(null, false),
  edituser: el => userForm(el.dataset.id, false),
  resetpw: el => userForm(el.dataset.id, true),
  deluser: el => { const u = S.members[el.dataset.id]; confirmBox('Delete ' + u.name + '?', `This removes <b>@${esc(u.username)}</b> and all of their personal entries, budgets and recurring items. Household entries they added stay. To keep their history, use <b>Disable</b> instead.`, 'Delete for good', async () => { await mutate('DELETE', '/api/users/' + u.id); toast('Member deleted'); }); },
  logout: async () => { try { await api('POST', '/api/logout'); } catch (e) {} location.replace('/login.html'); },
  savename: async () => { try { await mutate('PUT', '/api/me', { name: $('#me-name').value }); toast('Name saved'); } catch (e) { toast(e.message); } },
  changepw: async el => {
    const err = $('#pw-err'); err.textContent = '';
    const cur = $('#pw-cur').value, n1 = $('#pw-new').value, n2 = $('#pw-new2').value;
    if (n1 !== n2) { err.textContent = "The new passwords don't match."; return; }
    el.disabled = true;
    try { await mutate('POST', '/api/me/password', { currentPassword: cur, newPassword: n1 }); toast('Password updated'); location.hash = 'dashboard'; }
    catch (e) { err.textContent = e.message; el.disabled = false; }
  },
  export: async () => {
    const items = filteredTx();
    const rows = [['Date', 'Type', 'Whose', 'Relationship', 'Category', 'Sub-category', 'Payment mode', 'Amount', 'Note', 'Tags']];
    items.forEach(i => rows.push([i.date, i.type || 'expense', i.owner === HH ? 'Household' : rawName(i.owner), i.owner === HH ? '' : relOf(i.owner), entryLabel(i), i.sub || '', i.mode || '', i.amount, i.note || '', (i.tags || []).join(' ')]));
    const csv = rows.map(r => r.map(v => { const s = String(v ?? ''); return /[",\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s; }).join(',')).join('\n');
    const fname = 'expenses-' + todayISO() + '.csv';
    const url = URL.createObjectURL(new Blob(['\ufeff' + csv], { type: 'text/csv;charset=utf-8' }));
    const a = document.createElement('a'); a.href = url; a.download = fname; document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 2000);
  },
};
function collectCats() {
  document.querySelectorAll('#catlist .catrow').forEach(row => {
    const c = S.config.categories[+row.dataset.i]; if (!c) return;
    c.color = row.querySelector('[data-k=color]').value;
    c.name = row.querySelector('[data-k=name]').value.trim() || c.name;
    c.subs = row.querySelector('[data-k=subs]').value.split(',').map(s => s.trim()).filter(Boolean);
  });
}
try { const t = localStorage.getItem('et-theme'); if (t && t !== 'auto') document.documentElement.dataset.theme = t; } catch (e) {}
boot();
</script>
</body>
</html>
