<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Family Expense Tracker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  color-scheme: light;
  --bg:#f6f5f2; --surface:#fcfcfb; --surface-2:#f0efec; --line:#e3e1dc;
  --ink:#0b0b0b; --ink-2:#52514e; --ink-3:#8a8984;
  --accent:#2a78d6; --accent-ink:#ffffff; --accent-soft:#e3eefb;
  --good:#0ca30c; --good-ink:#006300; --warn:#fab219; --crit:#d03b3b;
  --shadow:0 1px 2px rgba(0,0,0,.05),0 4px 16px rgba(0,0,0,.04);
}
@media (prefers-color-scheme: dark){
  :root:where(:not([data-theme="light"])){
    color-scheme: dark;
    --bg:#121211; --surface:#1a1a19; --surface-2:#242422; --line:#333330;
    --ink:#f0efec; --ink-2:#c3c2b7; --ink-3:#8f8e86;
    --accent:#3987e5; --accent-ink:#ffffff; --accent-soft:#1d2d42;
    --good-ink:#4cc94c; --shadow:none;
  }
}
:root[data-theme="dark"]{
  color-scheme: dark;
  --bg:#121211; --surface:#1a1a19; --surface-2:#242422; --line:#333330;
  --ink:#f0efec; --ink-2:#c3c2b7; --ink-3:#8f8e86;
  --accent:#3987e5; --accent-ink:#ffffff; --accent-soft:#1d2d42;
  --good-ink:#4cc94c; --shadow:none;
}
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;background:var(--bg);color:var(--ink);font-size:14px;line-height:1.45;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
.app{display:grid;grid-template-columns:220px 1fr;min-height:100vh}
aside{background:var(--surface);border-right:1px solid var(--line);padding:18px 12px;display:flex;flex-direction:column;gap:4px;position:sticky;top:0;height:100vh}
.brand{display:flex;align-items:center;gap:10px;padding:4px 10px 18px;font-weight:700;font-size:15px}
.brand .logo{width:30px;height:30px;border-radius:8px;background:var(--accent);color:#fff;display:grid;place-items:center;font-weight:700}
nav a{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:8px;color:var(--ink-2);text-decoration:none;font-weight:500}
nav a:hover{background:var(--surface-2);color:var(--ink)}
nav a.active{background:var(--accent-soft);color:var(--accent)}
nav a svg{width:18px;height:18px;flex:none}
.whoami{margin-top:auto;padding:12px 10px;border-top:1px solid var(--line);font-size:12.5px;color:var(--ink-2)}
.whoami b{color:var(--ink);display:block;font-size:13.5px}
.role{display:inline-block;margin-top:4px;padding:1px 8px;border-radius:999px;background:var(--surface-2);font-size:11.5px;font-weight:600;color:var(--ink-2)}
main{padding:22px 28px 60px;max-width:1180px;width:100%}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:16px;flex-wrap:wrap}
h1{font-size:22px;margin:0;letter-spacing:-.01em}
h2{font-size:15px;margin:0 0 12px}
.sub{color:var(--ink-2);font-size:13px}
.btn{border:1px solid var(--line);background:var(--surface);padding:8px 14px;border-radius:8px;cursor:pointer;font-weight:500;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.btn:hover{background:var(--surface-2)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.07)}
.btn.small{padding:5px 10px;font-size:12.5px}
.btn.danger{color:var(--crit)}
.btn.ghost{border-color:transparent;background:transparent}
.btn:disabled{opacity:.5;cursor:not-allowed}
.filters{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:16px}
select,input[type=text],input[type=number],input[type=date],input[type=search],textarea{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:7px 10px;min-height:36px}
select:focus,input:focus,textarea:focus{outline:2px solid var(--accent);outline-offset:-1px}
.grid{display:grid;gap:14px}
.tiles{grid-template-columns:repeat(5,1fr)}
.two{grid-template-columns:1.25fr 1fr}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px 18px;box-shadow:var(--shadow);min-width:0}
.tile .lbl{font-size:12.5px;color:var(--ink-2);font-weight:500}
.tile .val{font-size:22px;font-weight:700;margin-top:4px;letter-spacing:-.01em;font-variant-numeric:tabular-nums}
.tile .meta{font-size:12px;color:var(--ink-3);margin-top:2px}
.up{color:var(--crit)} .down{color:var(--good-ink)}
.barlist{display:flex;flex-direction:column;gap:11px}
.brow{display:grid;grid-template-columns:130px 1fr 100px;gap:10px;align-items:center;font-size:13px}
.brow .name{display:flex;align-items:center;gap:7px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.dot{width:10px;height:10px;border-radius:3px;flex:none}
.track{height:10px;background:var(--surface-2);border-radius:4px;position:relative;overflow:hidden}
.fill{height:100%;border-radius:0 4px 4px 0;min-width:2px}
.brow .amt{text-align:right;font-variant-numeric:tabular-nums;font-weight:600}
.brow .amt small{display:block;font-weight:400;color:var(--ink-3);font-size:11.5px}
.budget-mark{position:absolute;top:-2px;bottom:-2px;width:2px;background:var(--ink)}
table{width:100%;border-collapse:collapse;font-size:13px}
th{text-align:left;font-weight:600;color:var(--ink-2);font-size:12px;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:9px 10px;border-bottom:1px solid var(--line);vertical-align:middle}
tr:last-child td{border-bottom:none}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.tag{display:inline-block;padding:1px 7px;border-radius:999px;background:var(--surface-2);font-size:11.5px;color:var(--ink-2);margin:1px 2px 1px 0}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:12.5px}
.empty{padding:28px;text-align:center;color:var(--ink-3)}
.tablewrap{overflow-x:auto}
.notice{padding:12px 14px;border-radius:10px;background:var(--accent-soft);color:var(--ink);margin-bottom:14px;font-size:13px}
.notice.warn{background:color-mix(in srgb,var(--warn) 18%,var(--surface))}
.status{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:600}
.status.ok{color:var(--good-ink)} .status.near{color:#a36b00} .status.over{color:var(--crit)}
:root[data-theme="dark"] .status.near{color:var(--warn)}
@media (prefers-color-scheme: dark){:root:where(:not([data-theme="light"])) .status.near{color:var(--warn)}}
/* modal */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.4);display:none;align-items:flex-start;justify-content:center;padding:6vh 14px;z-index:50;overflow:auto}
.scrim.open{display:flex}
.modal{background:var(--surface);border-radius:14px;width:100%;max-width:520px;padding:20px 22px;box-shadow:0 20px 60px rgba(0,0,0,.25)}
.modal h2{font-size:17px;margin-bottom:14px}
.form{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.form label{display:flex;flex-direction:column;gap:5px;font-size:12.5px;font-weight:500;color:var(--ink-2)}
.form .full{grid-column:1/-1}
.seg{display:inline-flex;background:var(--surface-2);border-radius:9px;padding:3px;gap:2px}
.seg button{border:none;background:transparent;padding:6px 14px;border-radius:7px;cursor:pointer;font-weight:500;color:var(--ink-2)}
.seg button.on{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.12)}
.actions{display:flex;justify-content:flex-end;gap:8px;margin-top:18px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px dashed var(--line);background:transparent;border-radius:999px;padding:4px 10px;font-size:12px;cursor:pointer;color:var(--ink-2)}
.chip:hover{border-style:solid;color:var(--ink)}
.err{color:var(--crit);font-size:12.5px;margin-top:8px;min-height:1em}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--surface);padding:10px 16px;border-radius:10px;font-size:13px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:60}
.toast.show{opacity:1}
#tip{position:fixed;pointer-events:none;background:var(--ink);color:var(--surface);padding:7px 10px;border-radius:8px;font-size:12px;opacity:0;transition:opacity .1s;z-index:70;white-space:nowrap}
#tip b{display:block}
.trend svg{width:100%;height:220px;display:block}
.trend .bar{fill:var(--accent)}
.trend .bar.cur{fill:var(--accent)}
.trend .hit{fill:transparent;cursor:default}
.trend .hit:hover + .bar, .trend g:hover .bar{filter:brightness(1.12)}
.axis text{fill:var(--ink-3);font-size:11px}
.gridline{stroke:var(--line);stroke-width:1}
.catrow{display:grid;grid-template-columns:34px 1.2fr 2fr 40px;gap:8px;align-items:center;margin-bottom:8px}
.catrow input[type=color]{width:34px;height:34px;border:1px solid var(--line);border-radius:8px;padding:2px;background:var(--surface)}
.list-inline{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
.mobile-bar{display:none}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
@media (max-width:1000px){.tiles{grid-template-columns:repeat(2,1fr)}.two{grid-template-columns:1fr}}
@media (max-width:760px){
  .app{grid-template-columns:1fr}
  aside{display:none}
  main{padding:14px 14px 90px}
  .mobile-bar{display:flex;position:fixed;bottom:0;left:0;right:0;background:var(--surface);border-top:1px solid var(--line);justify-content:space-around;padding:6px 4px;z-index:40}
  .mobile-bar a{display:flex;flex-direction:column;align-items:center;font-size:10.5px;color:var(--ink-2);text-decoration:none;padding:4px 6px;gap:2px}
  .mobile-bar a.active{color:var(--accent)}
  .mobile-bar svg{width:20px;height:20px}
  .brow{grid-template-columns:96px 1fr 84px}
  .form{grid-template-columns:1fr}
  .hide-sm{display:none}
}

/* calendar picker */
.dfield{display:inline-flex}
.form .dfield{display:flex}
.dbtn{display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:7px 10px;min-height:36px;cursor:pointer;font:inherit;color:var(--ink);width:100%;text-align:left;white-space:nowrap}
.dbtn:hover{background:var(--surface-2)}
.dbtn:focus-visible{outline:2px solid var(--accent);outline-offset:-1px}
.dbtn svg{width:16px;height:16px;color:var(--ink-3);flex:none}
.dbtn.none span{color:var(--ink-3)}
#cal{position:fixed;z-index:90;width:292px;background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:0 12px 40px rgba(0,0,0,.28);padding:12px;display:none;color:var(--ink)}
#cal.open{display:block}
.cal-h{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px;gap:6px}
.cal-nav{border:none;background:var(--surface-2);width:32px;height:32px;border-radius:8px;cursor:pointer;font-size:18px;line-height:1;color:var(--ink)}
.cal-nav:hover{background:var(--line)}
.cal-title{border:none;background:transparent;font:inherit;font-weight:600;font-size:14px;padding:6px 10px;border-radius:8px;cursor:pointer;color:var(--ink)}
.cal-title:not(:disabled):hover{background:var(--surface-2)}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;text-align:center}
.cal-grid.g3{grid-template-columns:repeat(3,1fr);gap:6px}
.cal-grid .dow{font-size:11px;color:var(--ink-3);padding:4px 0;font-weight:600}
.cal-day{border:none;background:transparent;border-radius:8px;height:35px;cursor:pointer;font:inherit;font-size:13px;position:relative;color:var(--ink);font-variant-numeric:tabular-nums}
.cal-day.wide{height:42px}
.cal-day:hover{background:var(--surface-2)}
.cal-day.out{color:var(--ink-3)}
.cal-day.today{box-shadow:inset 0 0 0 1.5px var(--accent)}
.cal-day.sel,.cal-day.sel:hover{background:var(--accent);color:#fff}
.cal-day.has::after{content:'';position:absolute;bottom:4px;left:50%;width:4px;height:4px;margin-left:-2px;border-radius:50%;background:var(--accent)}
.cal-day.sel.has::after{background:#fff}
.cal-foot{display:flex;justify-content:space-between;margin-top:8px;padding-top:8px;border-top:1px solid var(--line)}
.cal-foot button{border:none;background:transparent;color:var(--accent);font:inherit;font-size:13px;font-weight:600;cursor:pointer;padding:5px 8px;border-radius:6px}
.cal-foot button:hover{background:var(--accent-soft)}
.cal-t{font-weight:600;margin-bottom:8px;font-size:13px}
.cal-note{font-size:11.5px;color:var(--ink-3);margin-top:8px}
/* member panels */
details.mp{background:var(--surface);border:1px solid var(--line);border-radius:12px;margin-bottom:14px;box-shadow:var(--shadow)}
details.mp>summary{list-style:none;cursor:pointer;padding:14px 18px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
details.mp>summary::-webkit-details-marker{display:none}
details.mp .chev{transition:transform .15s;color:var(--ink-3);width:16px;height:16px;flex:none}
details.mp[open] .chev{transform:rotate(90deg)}
.mp-body{padding:0 18px 18px}
.mp-sum{margin-left:auto;display:flex;gap:16px;flex-wrap:wrap;font-size:12.5px;color:var(--ink-2)}
.mp-sum b{color:var(--ink);font-variant-numeric:tabular-nums}
.avatar{width:36px;height:36px;border-radius:50%;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;font-weight:700;flex:none}
.mstats{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;margin-bottom:14px}
.mstat{background:var(--surface-2);border-radius:10px;padding:10px 12px}
.mstat .lbl{font-size:12px;color:var(--ink-2)}
.mstat .val{font-size:17px;font-weight:700;font-variant-numeric:tabular-nums}
.mp .card{box-shadow:none;background:var(--bg)}
.mp-head{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
@media (max-width:1000px){.mstats{grid-template-columns:repeat(2,1fr)}}
/* multi-select (family view) */
.msel{position:relative;display:inline-block}
.msel-btn{display:inline-flex;align-items:center;gap:8px;max-width:100%}
.msel-btn svg{width:16px;height:16px;flex:none}
.msel-pop{position:absolute;z-index:30;top:calc(100% + 6px);left:0;min-width:320px;max-width:92vw;max-height:62vh;overflow:auto;background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:0 12px 40px rgba(0,0,0,.22);padding:6px}
.msel-row{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:8px;cursor:pointer;min-height:40px}
.msel-row:hover{background:var(--surface-2)}
.msel-row input{width:18px;height:18px;flex:none;accent-color:var(--accent)}
.msel-row .only{margin-left:auto;border:none;background:transparent;color:var(--accent);font-weight:600;font-size:12.5px;cursor:pointer;padding:4px 8px;border-radius:6px}
.msel-row .only:hover{background:var(--accent-soft)}
.msel-sep{height:1px;background:var(--line);margin:4px 2px}
.msel-foot{display:flex;justify-content:space-between;gap:8px;padding:6px 6px 2px}
.hint{font-size:12px;color:var(--ink-3);font-weight:400}
.only-sm{display:none}
.fab{display:none}
.subpick select,.subpick input{width:100%}
.diag-ok{color:var(--good-ink);font-weight:600}.diag-bad{color:var(--crit);font-weight:600}
.more-item{display:flex;align-items:center;gap:12px;padding:12px 8px;border-radius:10px;color:var(--ink);text-decoration:none;font-weight:500;border-bottom:1px solid var(--line)}
.more-item svg{width:20px;height:20px;color:var(--ink-2)}
.more-item:last-of-type{border-bottom:none}
.payrow{display:grid;grid-template-columns:1fr 1fr;gap:12px;background:var(--surface-2);border-radius:10px;padding:12px}
.payrow .full{grid-column:1/-1}
@media (max-width:760px){
  .only-sm{display:block}
  .payrow{grid-template-columns:1fr}
  .fab{display:grid;place-items:center;position:fixed;right:16px;bottom:76px;width:54px;height:54px;border-radius:50%;background:var(--accent);color:#fff;font-size:30px;line-height:1;border:none;box-shadow:0 6px 20px rgba(0,0,0,.28);z-index:45;cursor:pointer}
  .msel{display:block;width:100%}
  .msel-btn{width:100%;justify-content:space-between}
  .msel-pop{position:fixed;left:10px;right:10px;top:auto;bottom:74px;min-width:0;max-height:64vh;z-index:48}
  .catrow{grid-template-columns:34px 1fr 40px}
  .catrow input[type=color]{grid-column:1;grid-row:1}
  .catrow [data-k=name]{grid-column:2;grid-row:1}
  .catrow button{grid-column:3;grid-row:1}
  .catrow [data-k=subs]{grid-column:1/-1;grid-row:2}
  .top .btn{white-space:normal}
  /* tables become one card per row on phones, so every column and every Edit / Delete button is reachable without side-scrolling */
  table.stack,table.stack tbody{display:block}
  table.stack thead{display:none}
  table.stack tr{display:flex;flex-direction:column;padding:10px 6px;border-bottom:1px solid var(--line)}
  table.stack tr:last-child{border-bottom:none}
  table.stack td{display:flex;justify-content:space-between;align-items:baseline;gap:14px;border:none;padding:3px 2px;text-align:right;white-space:normal}
  table.stack td.hide-sm{display:flex}
  table.stack td::before{content:attr(data-label);color:var(--ink-3);font-size:12px;font-weight:500;text-align:left;flex:none;max-width:42%}
  table.stack td:not([data-label])::before{content:none}
  table.stack td.first{display:block;text-align:left;font-size:14px;padding-bottom:4px;order:-1}
  table.stack td.first::before{content:none}
  table.stack td.acts{display:flex;justify-content:flex-start;flex-wrap:wrap;gap:4px;padding-top:6px;order:99}
  table.stack td.acts::before{content:none}
  table.stack td.c-amt{order:2;font-size:15px}
  table.stack td.c-date{order:3}
  table.stack td.c-note{order:4}
  table.stack td.c-mode{order:5}
  table.stack td.c-who{order:6}
  .filters select,.filters .dfield,.filters input[type=search]{flex:1 1 140px;min-width:0}
}
</style>
</head>
<body>
<div class="app">
  <aside>
    <div class="brand"><div class="logo">₹</div>Family Expenses</div>
    <nav id="nav"></nav>
    <div class="whoami" id="whoami">Connecting…</div>
  </aside>
  <main id="main">
    <div class="empty">Loading your expense tracker…</div>
  </main>
</div>
<div class="mobile-bar" id="mnav"></div>

<div class="scrim" id="scrim"><div class="modal" id="modal" role="dialog" aria-modal="true"></div></div>
<div class="toast" id="toast"></div>
<div id="tip"></div>
<div id="cal" role="dialog" aria-label="Calendar"></div>

<script>
/* ============ helpers ============ */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
const pad = n => String(n).padStart(2, '0');
const isoDate = d => d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
const todayISO = () => isoDate(new Date());
const ymOf = iso => iso.slice(0, 7);
const parseISO = s => { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d); };
const MONTHS = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const fmtDate = iso => { const d = parseISO(iso); return d.getDate() + ' ' + MONTHS[d.getMonth()] + ' ' + d.getFullYear(); };
let CUR = '₹';
const money = (n, short) => {
  const v = Math.round((n || 0) * 100) / 100;
  if (short && Math.abs(v) >= 100000) return CUR + (v / 100000).toFixed(1).replace(/\.0$/, '') + 'L';
  if (short && Math.abs(v) >= 1000) return CUR + (v / 1000).toFixed(1).replace(/\.0$/, '') + 'k';
  return CUR + v.toLocaleString('en-IN', { maximumFractionDigits: 2 });
};
function toast(msg) { const t = $('#toast'); t.textContent = msg; t.classList.add('show'); clearTimeout(toast._t); toast._t = setTimeout(() => t.classList.remove('show'), 2600); }
const tip = $('#tip');
function showTip(e, html) { tip.innerHTML = html; tip.style.opacity = 1; const x = Math.min(e.clientX + 14, innerWidth - tip.offsetWidth - 8); tip.style.left = x + 'px'; tip.style.top = (e.clientY - tip.offsetHeight - 10) + 'px'; }
function hideTip() { tip.style.opacity = 0; }

/* ============ defaults (used until the admin saves settings) ============ */
const PALETTE = ['#2a78d6','#eb6834','#1baf7a','#eda100','#e87ba4','#008300','#6250d6','#e34948','#7a7a74','#256abf','#d95926','#199e70'];
const DEFAULT_CONFIG = {
  currency: '₹',
  monthStartDay: 1,
  categories: [

      <div class="cal-grid g3">${MONTHS.map((n, i) => { const ym = CAL.y + '-' + pad(i + 1); return `<button type="button" class="cal-day wide${v === ym ? ' sel' : ''}${today.slice(0, 7) === ym ? ' today' : ''}" data-pickm="${i}">${n}</button>`; }).join('')}</div>${CAL.mode === 'month' ? foot('This month') : ''}`;
  } else {
    const offset = (new Date(CAL.y, CAL.m, 1).getDay() + 6) % 7, dim = new Date(CAL.y, CAL.m + 1, 0).getDate();

      cells += `<button type="button" class="cal-day${d.getMonth() !== CAL.m ? ' out' : ''}${iso === today ? ' today' : ''}${iso === v ? ' sel' : ''}${marks.has(iso) ? ' has' : ''}" data-pick="${iso}" aria-label="${fmtDate(iso)}">${d.getDate()}</button>`;
    }
    h = `<div class="cal-h"><button type="button" class="cal-nav" data-nav="-1" aria-label="Previous month">‹</button><button type="button" class="cal-title" data-view="months">${FULL_MONTHS[CAL.m]} ${CAL.y} ▾</button><button type="button" class="cal-nav" data-nav="1" aria-label="Next month">›</button></div><div class="cal-grid">${cells}</div>${foot('Today')}`;
  }

}
function placeCal() {

function setCal(v) {

$('#cal').addEventListener('click', e => {

function periodControls() {

function rangeLabel(r) { const e = new Date(r[1] - 864e5); if (S.f.period === 'all') return 'All time'; return fmtDate(isoDate(r[0])) + ' – ' + fmtDate(isoDate(e)); }

function bindCommon() {
  document.querySelectorAll('[data-f]').forEach(el => {

function sum(items, type = 'expense') { return items.filter(i => (i.type || 'expense') === type).reduce((a, b) => a + (+b.amount || 0), 0); }
function groupBy(items, key) { const m = {}; items.forEach(i => { const k = typeof key === 'function' ? key(i) : i[key]; m[k] = (m[k] || 0) + (+i.amount || 0); }); return m; }

function barList(rows, opts = {}) {
  // rows: [{label, color, value, budget, sub}]
  if (!rows.length) return `<div class="empty">No entries in this period.</div>`;
  const max = Math.max(...rows.map(r => Math.max(r.value, r.budget || 0)), 1);
  return `<div class="barlist">${rows.map(r => {
    const pct = r.value / max * 100;
    const bpct = r.budget ? r.budget / max * 100 : null;
    const share = opts.total ? Math.round(r.value / opts.total * 100) + '%' : '';
    const tipTxt = `<b>${esc(r.label)}</b>${money(r.value)}${share ? ' · ' + share + ' of total' : ''}${r.budget ? '<br>Budget ' + money(r.budget) : ''}`;
    return `<div class="brow" data-tip="${esc(tipTxt)}"><div class="name"><span class="dot" style="background:${esc(r.color)}"></span>${esc(r.label)}</div>
      <div class="track"><div class="fill" style="width:${pct}%;background:${esc(r.color)}"></div>${bpct != null ? `<div class="budget-mark" style="left:calc(${bpct}% - 1px)" title="Budget"></div>` : ''}</div>
      <div class="amt">${money(r.value)}${r.sub ? `<small>${r.sub}</small>` : share ? `<small>${share}</small>` : ''}</div></div>`;
  }).join('')}</div>`;
}

function trendChart(items) {
  // last 6 budget-months, expense totals
  const bars = [];
  for (let k = -5; k <= 0; k++) {
    const r = monthRange(k);
    const v = sum(items.filter(i => inRange(i, r)));
    const inc = sum(items.filter(i => inRange(i, r)), 'income');
    bars.push({ label: MONTHS[r[0].getMonth()] + (r[0].getMonth() === 0 ? " '" + String(r[0].getFullYear()).slice(2) : ''), v, inc, cur: k === 0, range: r });
  }
  const W = 560, H = 220, L = 46, R = 8, T = 12, B = 26;
  const max = niceMax(Math.max(...bars.map(b => b.v), 1000));
  const bw = (W - L - R) / bars.length; const barW = Math.min(44, bw * 0.55);
  const y = v => T + (H - T - B) * (1 - v / max);
  let g = '';
  for (let i = 0; i <= 4; i++) { const v = max * i / 4; g += `<line class="gridline" x1="${L}" x2="${W - R}" y1="${y(v)}" y2="${y(v)}"/><text x="${L - 6}" y="${y(v) + 4}" text-anchor="end">${money(v, true)}</text>`; }
  const marks = bars.map((b, i) => {
    const x = L + bw * i + (bw - barW) / 2; const yy = y(b.v); const h = Math.max(H - B - yy, b.v > 0 ? 2 : 0);
    const r = Math.min(4, h);
    const path = h > 0 ? `M${x},${H - B} V${yy + r} Q${x},${yy} ${x + r},${yy} H${x + barW - r} Q${x + barW},${yy} ${x + barW},${yy + r} V${H - B} Z` : '';
    const t = `<b>${esc(b.label)}${b.cur ? ' (current)' : ''}</b>Spent ${money(b.v)}${b.inc ? '<br>Income ' + money(b.inc) : ''}`;
    return `<g data-tip="${esc(t)}"><rect class="hit" x="${L + bw * i}" y="${T}" width="${bw}" height="${H - T - B}"/>${path ? `<path class="bar" d="${path}" style="opacity:${b.cur ? 1 : .55}"/>` : ''}<text x="${x + barW / 2}" y="${H - 8}" text-anchor="middle">${esc(b.label)}</text></g>`;
  }).join('');
  return `<div class="trend"><svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" role="img" aria-label="Spending over the last 6 months"><g class="axis">${g}${marks}</g></svg></div>
  <table class="sr"><tr><th>Month</th><th>Spent</th></tr>${bars.map(b => `<tr><td>${b.label}</td><td>${money(b.v)}</td></tr>`).join('')}</table>`;
}
function niceMax(v) { const st = v / 4; const p = Math.pow(10, Math.floor(Math.log10(st))); const n = st / p; return (n <= 1 ? 1 : n <= 2 ? 2 : n <= 2.5 ? 2.5 : n <= 5 ? 5 : 10) * p * 4; }

function budgetFor(scope) {
  const b = S.budgets[scope === 'me' ? S.me : scope];
  return { budgets: (b && b.budgets) || {}, total: +(b && b.total) || 0 };
}
function statusBadge(spent, budget) {
  if (!budget) return '';
  const p = spent / budget;
  if (p >= 1) return `<span class="status over">▲ Over by ${money(spent - budget)}</span>`;
  if (p >= .8) return `<span class="status near">● ${Math.round(p * 100)}% used</span>`;
  return `<span class="status ok">✓ ${money(budget - spent)} left</span>`;
}

/* ============ views ============ */
function scopeNote(scope) {
  const t = scope === HH ? 'Every shared household item, whoever paid for it.' : scope === 'all' ? 'Every member plus the household, each entry counted once.' : scope === SHARED ? 'Household items not taken from any one person’s salary.'
    : 'Their own entries plus the household expenses taken from their salary.';
  return `<div class="hint" style="margin-top:2px">${t}</div>`;
}
function viewDashboard() {
  const scope = S.f.scope; const r = periodRange(S.f.period);
  const all = scopeItems(scope);
  const items = all.filter(i => inRange(i, r));
  const prev = all.filter(i => inRange(i, prevRange(r)));
  const spent = sum(items), income = sum(items, 'income'), saved = sum(items, 'saving'), pSpent = sum(prev);
  const left = income - spent - saved;
  const days = Math.max(1, Math.min(Math.round((Math.min(Date.now(), +r[1]) - r[0]) / 864e5), Math.round((r[1] - r[0]) / 864e5)));

  const byMode = groupBy(exp, i => i.mode || 'Not set');

    <div class="card tile"><div class="lbl">Saved & invested</div><div class="val">${money(saved)}</div><div class="meta">${income && saved ? Math.round(saved / income * 100) + '% of income' : 'SIP, RD, chit…'}</div></div>
    <div class="card tile"><div class="lbl">Balance left</div><div class="val ${left < 0 ? 'up' : ''}">${money(left)}</div><div class="meta">${income ? 'income − spent − saved' : 'Add income to see this'}</div></div>
    <div class="card tile"><div class="lbl">vs previous period</div><div class="val ${change > 0 ? 'up' : change < 0 ? 'down' : ''}">${change === null ? '—' : (change > 0 ? '▲ ' : change < 0 ? '▼ ' : '') + Math.abs(change) + '%'}</div><div class="meta">${change === null ? 'No earlier data' : (change > 0 ? 'Spending more' : change < 0 ? 'Spending less' : 'Same') + ' · avg ' + money(spent / days, true) + '/day'}</div></div>
  </div>

    <div class="card">${commitmentsCard(scope)}</div>
  </div>
  <div class="grid two" style="margin-bottom:14px">

    <div class="card"><h2>Monthly spending · last 6 months</h2>${trendChart(all)}</div>
  </div>

  </div>`;
}

function calcStatement(items, income, spent, saved, left, scope) {
  if (!items.length) return `<div class="empty">No entries in this period.</div>`;
  const exp = items.filter(i => typeOf(i) === 'expense');
  const emi = exp.filter(i => i.cat === 'emi').reduce((a, b) => a + b.amount, 0);
  const hhExp = exp.filter(i => i.owner === HH).reduce((a, b) => a + b.amount, 0);
  const savBy = groupBy(items.filter(i => typeOf(i) === 'saving'), 'cat');
  const row = (label, val, opts = {}) => `<tr><td style="${opts.indent ? 'padding-left:26px;color:var(--ink-2)' : ''}${opts.bold ? 'font-weight:700' : ''}">${label}</td><td class="num" style="${opts.bold ? 'font-weight:700;font-size:15px;' : ''}${opts.color ? 'color:' + opts.color : ''}">${val}</td></tr>`;
  const split = hhExp > 0 && scope !== HH;      // person view: show how much of the spending is their household share
  return `<table><tbody>
    ${row('<span class="pill"><span class="dot" style="background:var(--good)"></span>Income</span>', money(income), { bold: true })}
    ${row('<span class="pill"><span class="dot" style="background:var(--crit)"></span>− Expenses</span>', money(spent), { bold: true })}
    ${split ? row('personal spending', money(spent - hhExp), { indent: true }) : ''}
    ${split ? row(scope === 'all' ? 'household expenses' : 'household share (taken from this salary)', money(hhExp), { indent: true }) : ''}
    ${emi ? row('of which EMI & loans', money(emi), { indent: true }) : ''}
    ${row('<span class="pill"><span class="dot" style="background:' + SAVE_COLOR + '"></span>− Savings & investments</span>', money(saved), { bold: true })}
    ${Object.entries(savBy).sort((a, b) => b[1] - a[1]).map(([k, v]) => row(esc(k), money(v), { indent: true })).join('')}
    <tr><td colspan="2" style="padding:0;border-bottom:2px solid var(--ink)"></td></tr>
    ${row('= Balance left', money(left), { bold: true, color: left < 0 ? 'var(--crit)' : 'var(--good-ink)' })}
  </tbody></table>${left < 0 && income ? `<p class="status over" style="margin:10px 0 0">▲ You've spent and saved ${money(-left)} more than your income this period.</p>` : ''}`;
}
// Whose salary a recurring rule is taken from: its owner, or (household rules) the member chosen when it was set up.
function debitOfRule(r) { return r.target === HH ? (r.debitFrom || r.owner) : r.owner; }
// Which recurring rules count for a scope: 'me' / a member id (their own rules + household rules taken from their salary),
// HH (all shared household rules), 'shared' (household rules paid from the pool) or 'all'.
function rulesForScope(scope) {
  return Object.entries(S.recurring).filter(([, r]) => {
    if (!r || r.deleted) return false;
    if (scope === 'all') return true;
    if (scope === HH) return r.target === HH;
    return debitOfRule(r) === (scope === 'me' ? S.me : scope);
  });
}
function canEditRule(r) { return S.canWrite && (S.isAdmin || r.owner === S.me); }
function commitmentsCard(scope = 'me') {
  const all = rulesForScope(scope).map(([id, r]) => [id, r, ruleProgress(id, r)]);
  const live = all.filter(([, r, p]) => !r.paused && !p.done);
  const sumOf = t => live.filter(([, r]) => typeOf(r) === t).reduce((a, [, r]) => a + r.amount, 0);
  const emi = sumOf('expense'), sav = sumOf('saving');

  const add = S.canWrite ? `<button class="btn small" data-act="addrec" data-who="${esc(forPerson)}" data-target="${scope === HH || scope === SHARED ? HH : 'me'}" data-debit="${scope === SHARED ? SHARED : ''}">+ Add</button>` : '';
  const head = `<div style="display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:12px"><h2 style="margin:0">Fixed monthly commitments</h2>${add}</div>`;
  if (!all.length) return head + (scope === 'me' && S.canWrite ? `<div class="empty">Add your EMI, SIP, RD, chit or rent with “+ Add” and they'll be added every month automatically.</div>` : `<div class="empty">No fixed monthly commitments set up yet.</div>`);
  const who = r => r.target === HH ? 'household · ' + (debitOfRule(r) === SHARED ? 'shared pool' : debitOfRule(r) === S.me ? 'from your salary' : 'from ' + rawName(debitOfRule(r)) + "'s salary") : (scope === 'all' || scope === HH ? rawName(r.owner) : '');
  return head + `<div style="display:flex;gap:20px;flex-wrap:wrap;margin-bottom:12px">
      <div><div class="sub">Every month</div><div style="font-size:20px;font-weight:700" data-t="commit-total">${money(emi + sav)}</div></div>
      <div><div class="sub">Expenses / EMI</div><div style="font-size:16px;font-weight:600">${money(emi)}</div></div>
      <div><div class="sub">Savings</div><div style="font-size:16px;font-weight:600">${money(sav)}</div></div></div>

// What counts for one person: their own entries plus the household entries taken from their salary.

}

// The rows of the family table: every member (you first) plus the shared household pool.

function viewRecurring() {
  const who = S.isAdmin ? S.f.rwho : null;
  const rules = Object.entries(S.recurring).filter(([, r]) => r && !r.deleted && (!who || who === 'all' || r.owner === (who === 'me' ? S.me : who))).map(([id, r]) => [id, r, ruleProgress(id, r)]);
  const whoSel = S.isAdmin ? `<div class="filters"><select data-f="rwho" aria-label="Whose recurring entries"><option value="me" ${who === 'me' ? 'selected' : ''}>My entries</option>${Object.keys(S.members).filter(i => i !== S.me && S.members[i].active !== false).map(i => `<option value="${esc(i)}" ${who === i ? 'selected' : ''}>${esc(nameOf(i))}</option>`).join('')}<option value="all" ${who === 'all' ? 'selected' : ''}>Everyone</option></select></div>` : '';
  const active = rules.filter(([, r, p]) => !r.paused && !p.done);

function ago(ms) {
  if (!ms) return '—';
  const sec = Math.round((Date.now() - ms) / 1000);
  if (sec < 60) return 'just now';
  if (sec < 3600) return Math.round(sec / 60) + ' min ago';
  if (sec < 86400) return Math.round(sec / 3600) + ' h ago';
  return fmtDate(isoDate(new Date(ms)));
}
function diagHtml(d) {
  const db = d.db;

  const mem = d.members.map(m => `<tr><td>${esc(m.name)}${m.id === d.you.id ? ' <span class="sub">(you)</span>' : ''}${m.active ? '' : ' <span class="tag">disabled</span>'}<div class="sub">${esc(m.relationship || roleLabel(m.role))}</div></td><td class="num">${m.entries}</td><td class="num hide-sm">${m.rules}</td><td class="hide-sm">${ago(m.lastEntry)}</td><td class="hide-sm">${ago(m.lastLogin)}</td></tr>`).join('');

async function pickRestoreFile(input) {
  const out = $('#restore-out'); S.restoreData = null;
  const f = input.files && input.files[0];
  if (!f) { out.innerHTML = ''; return; }
  const bad = msg => { out.innerHTML = `<span class="diag-bad">${esc(msg)}</span>`; };
  if (f.size > 3.8e6) return bad('That file is too big to be a backup of this app.');
  let d;
  try { d = JSON.parse(await f.text()); } catch (e) { return bad('That file could not be read. Choose the .json file from Download full backup.'); }
  if (!d || d.app !== 'family-expense-tracker' || !Array.isArray(d.users) || !Array.isArray(d.entries)) return bad('This is not a backup from the Family Expense Tracker.');
  S.restoreData = d; S.dirty = true;
  const when = d.exportedAt && !isNaN(Date.parse(d.exportedAt)) ? fmtDate(isoDate(new Date(d.exportedAt))) : 'an unknown date';
  const rules = Array.isArray(d.recurring) ? d.recurring.length : 0;
  out.innerHTML = `<div style="margin-bottom:8px">Backup made on <b>${esc(when)}</b>: <b>${d.users.length}</b> members, <b>${d.entries.length}</b> entries, <b>${rules}</b> recurring commitments.</div>
    <p class="hint" style="margin:0 0 10px">Members are matched by username. Anyone not found here is created with a temporary password, shown once on the next screen.</p>
    <button class="btn primary" id="restore-go">Restore into this database</button>`;
  $('#restore-go').onclick = e => ACTIONS.dorestore(e.currentTarget);
}

function openModal(html, onBind) { $('#modal').innerHTML = html; $('#scrim').classList.add('open'); onBind && onBind($('#modal')); const f = $('#modal').querySelector('[data-autofocus]') || $('#modal').querySelector('input:not([type=hidden]),select'); f && f.focus(); }
function closeModal() { $('#scrim').classList.remove('open'); $('#modal').innerHTML = ''; }

function findItem(owner, id) { return allItems(owner).find(i => i.id === id); }
function quickPicks() {
  const seen = new Map();
  [...allItems(S.me), ...allItems(HH)].filter(i => (i.type || 'expense') === 'expense' && !i.recurring).sort((a, b) => (b.created || 0) - (a.created || 0)).forEach(i => {
    const k = i.cat + '|' + (i.sub || '') + '|' + (i.note || '') + '|' + i.amount;
    if (!seen.has(k) && seen.size < 6) seen.set(k, i);

/* ----- sub-category picker: a dropdown of the category's sub-categories + "Other (type your own)" ----- */
function subPickerHtml(p) {
  return `<select id="${p}-subsel" aria-label="Sub-category"></select><input type="text" id="${p}-subtxt" maxlength="60" placeholder="Type your own sub-category" aria-label="Your own sub-category" style="display:none;margin-top:6px">`;
}
function subPickerFill(m, p, catId, current) {
  const sel = m.querySelector('#' + p + '-subsel'), txt = m.querySelector('#' + p + '-subtxt');
  const known = (catById(catId).subs || []);
  const used = new Set();
  const note = e => { if (e.cat === catId && typeOf(e) === 'expense' && e.sub && !known.includes(e.sub)) used.add(e.sub); };
  S.entries.forEach(note); Object.values(S.recurring).forEach(note);
  const usedList = [...used].sort((a, b) => a.localeCompare(b));
  const inList = !current || known.includes(current) || used.has(current);
  sel.innerHTML = `<option value="">— None —</option>` + known.map(s => `<option value="${esc(s)}">${esc(s)}</option>`).join('') +
    (usedList.length ? `<optgroup label="Used before">${usedList.map(s => `<option value="${esc(s)}">${esc(s)}</option>`).join('')}</optgroup>` : '') +
    `<option value="__other">Other (type your own)…</option>`;
  if (current && !inList) { sel.value = '__other'; txt.value = current; } else { sel.value = current || ''; txt.value = ''; }
  txt.style.display = sel.value === '__other' ? '' : 'none';
}
function subPickerBind(m, p) {
  const sel = m.querySelector('#' + p + '-subsel'), txt = m.querySelector('#' + p + '-subtxt');
  sel.addEventListener('change', () => { txt.style.display = sel.value === '__other' ? '' : 'none'; if (sel.value === '__other') txt.focus(); });
}
function subPickerValue(m, p) {

  return sel.value === '__other' ? m.querySelector('#' + p + '-subtxt').value.trim() : sel.value;
}
// <option>s for a member picker (you first). `extra` ids that are no longer selectable are kept so editing never silently changes them.
function memberOptions(selected, { shared = false, extra = [] } = {}) {
  const ids = chargeable();
  extra.filter(x => x && x !== SHARED && !ids.includes(x)).forEach(x => ids.push(x));
  return ids.map(id => `<option value="${esc(id)}" ${selected === id ? 'selected' : ''}>${esc(nameOf(id))}</option>`).join('') +
    (shared ? `<option value="${SHARED}" ${selected === SHARED ? 'selected' : ''}>Shared family pool (no one's salary)</option>` : '');
}
// Where a brand-new entry should go by default, based on what the person is looking at.
function defaultTarget() {

    const fill = (initial) => {
      const sel = q('#r-cat'); const want = initial ? r.cat : sel.value; const opts = typeCats(type);
      sel.innerHTML = opts.map(c => `<option value="${esc(c.v)}">${esc(c.l)}</option>`).join('');
      if (want && !opts.some(c => c.v === want)) sel.insertAdjacentHTML('beforeend', `<option value="${esc(want)}">${esc(type === 'expense' ? catById(want).name : want)}</option>`);
      if (want) sel.value = want;
      q('#rl-sub').style.display = type === 'expense' ? '' : 'none';
      subPickerFill(m, 'r', sel.value, initial ? (r.sub || '') : '');
      updatePay();
    };
    seg('r-type', type); seg('r-target', target); fill(true); subPickerBind(m, 'r'); updatePay();
    m.querySelectorAll('#r-type button').forEach(b => b.onclick = () => { type = b.dataset.v; seg('r-type', type); fill(false); });
    m.querySelectorAll('#r-target button').forEach(b => b.onclick = () => { target = b.dataset.v; seg('r-target', target); updatePay(); });
    q('#r-cat').onchange = () => subPickerFill(m, 'r', q('#r-cat').value, '');
    if (S.isAdmin) q('#r-who').onchange = () => { if (!debitTouched) { const w = q('#r-who').value; if ([...q('#r-debit').options].some(o => o.value === w)) q('#r-debit').value = w; } updatePay(); };
    q('#r-debit').onchange = () => { debitTouched = true; updatePay(); };
    q('[data-x=no]').onclick = closeModal;
    if (id) q('[data-x=del]').onclick = () => confirmBox('Delete this recurring entry?', 'Entries already added stay in the history. Future months won\'t be added.', 'Delete', async () => { await mutate('DELETE', '/api/recurring/' + id); toast('Recurring entry deleted'); });
    q('[data-x=yes]').onclick = async () => {
      const err = q('#r-err'); err.textContent = '';
      const amount = parseFloat(q('#r-amt').value); const day = parseInt(q('#r-day').value, 10);
      if (!(amount > 0)) { err.textContent = 'Enter an amount.'; return; }
      if (!(day >= 1 && day <= 31)) { err.textContent = 'Pick the day of the month (1–31).'; return; }
      const rule = { type, amount, day, cat: q('#r-cat').value, sub: type === 'expense' ? subPickerValue(m, 'r') : '', mode: q('#r-mode').value, note: q('#r-note').value.trim(), target, installments: parseInt(q('#r-inst').value, 10) || null, maturity: parseFloat(q('#r-mat').value) || null };
      if (S.isAdmin) rule.userId = who();
      if (target === HH) rule.debitFrom = q('#r-debit').value;
      if (id) rule.applyCurrent = q('#r-apply').checked; else rule.startYm = q('#r-start').value || todayISO().slice(0, 7);
      const btn = q('[data-x=yes]'); btn.disabled = true;
      try { if (id) await mutate('PUT', '/api/recurring/' + id, rule); else await mutate('POST', '/api/recurring', rule); closeModal(); toast(id ? 'Recurring entry updated' : 'Recurring entry added'); }
      catch (e) { btn.disabled = false; err.textContent = writeError(e); }
    };
  });
}

/* ============ actions ============ */
const ACTIONS = {
  add: () => entryForm(null),
  edit: el => { const it = findItem(el.dataset.owner, el.dataset.id); it && entryForm(it); },
  del: el => { const it = findItem(el.dataset.owner, el.dataset.id); if (!it) return; confirmBox('Delete this entry?', `${esc(fmtDate(it.date))} · ${esc(it.note || entryLabel(it))} · <b>${money(it.amount)}</b>${S.isAdmin ? ' · ' + esc(it.owner === HH ? 'Household' : rawName(it.owner)) : ''}<br>This cannot be undone.`, 'Delete', async () => { await mutate('DELETE', '/api/entries/' + it.id); toast('Entry deleted'); }); },
  openperson: el => { S.f.scope = el.dataset.id === S.me ? 'me' : el.dataset.id; location.hash = el.dataset.to || 'dashboard'; },
  jump: el => { const d = document.getElementById('mp-' + el.dataset.id); if (d) { d.open = true; S.mpOpen[el.dataset.id] = true; d.scrollIntoView({ behavior: 'smooth', block: 'start' }); } },
  backup: async el => {
    el.disabled = true;
    try {
      const r = await fetch('/api/backup', { credentials: 'same-origin' });
      if (!r.ok) throw new Error('Could not create the backup.');
      const url = URL.createObjectURL(await r.blob());
      const a = document.createElement('a'); a.href = url; a.download = 'expense-tracker-backup-' + todayISO() + '.json'; document.body.appendChild(a); a.click(); a.remove();
      setTimeout(() => URL.revokeObjectURL(url), 2000); toast('Backup downloaded');
    } catch (e) { toast(e.message); }
    el.disabled = false;
  },
  dorestore: async el => {
    if (!S.restoreData) return;
    el.disabled = true; el.textContent = 'Restoring…';
    try {
      const r = await api('POST', '/api/restore', S.restoreData);
      S.restoreData = null; S.dirty = false; S.force = true; await load();
      showRestoreResult(r);
    } catch (e) { toast(e.message); el.disabled = false; el.textContent = 'Restore into this database'; }
  },
  viewperson: el => { S.f.scope = el.dataset.id === S.me ? 'me' : el.dataset.id; location.hash = 'transactions'; },
  editbudget: el => budgetForm(el.dataset.key),
  addrec: el => recForm(null, { userId: el.dataset.who, target: el.dataset.target, debit: el.dataset.debit }),
  editrec: el => recForm(el.dataset.id),
  famtoggle: () => { S.famOpen = !S.famOpen; render(); },
  famdone: () => { S.famOpen = false; render(); },
  rundiag: runDiagnostics,
  pauserec: async el => { const r = S.recurring[el.dataset.id]; try { await mutate('PUT', '/api/recurring/' + el.dataset.id, { paused: !r.paused }); } catch (e) { toast(writeError(e)); } },
  delrec: el => confirmBox('Delete this recurring entry?', 'Entries already added stay in your history. Future months won\'t be added.', 'Delete', () => mutate('DELETE', '/api/recurring/' + el.dataset.id)),
  theme: el => { const t = el.dataset.t; if (t === 'auto') delete document.documentElement.dataset.theme; else document.documentElement.dataset.theme = t; try { localStorage.setItem('et-theme', t); } catch (e) {} S.force = true; collectCats(); render(); },
  addcat: () => { collectCats(); S.config.categories.push({ id: 'c' + uid().slice(-6), name: 'New category', color: PALETTE[S.config.categories.length % PALETTE.length], subs: [] }); S.dirty = true; S.force = true; render(); },
  delcat: el => { collectCats(); S.config.categories.splice(+el.dataset.i, 1); S.dirty = true; S.force = true; render(); },
  savesettings: async el => {
    collectCats();
    const cfg = { ...S.config,
      modes: $('#set-modes').value.split(',').map(s => s.trim()).filter(Boolean),
      incomeCategories: $('#set-inc').value.split(',').map(s => s.trim()).filter(Boolean),
      savingCategories: $('#set-sav').value.split(',').map(s => s.trim()).filter(Boolean),
      currency: $('#set-cur').value.trim() || '₹',
      monthStartDay: Math.min(28, Math.max(1, parseInt($('#set-start').value, 10) || 1)) };
    if (!cfg.categories.length) { toast('Keep at least one category'); return; }
    el.disabled = true;
    try { await saveConfig(cfg); S.dirty = false; S.force = true; render(); toast('Settings saved for everyone'); } catch (e) { toast(writeError(e)); }
    el.disabled = false;
  },
  adduser: () => userForm(null, false),
  edituser: el => userForm(el.dataset.id, false),
  resetpw: el => userForm(el.dataset.id, true),
  deluser: el => { const u = S.members[el.dataset.id]; confirmBox('Delete ' + u.name + '?', `This removes <b>@${esc(u.username)}</b> and all of their personal entries, budgets and recurring items. Household entries they added stay, and the part taken from their salary moves to the shared pool. To keep their history, use <b>Disable</b> instead.`, 'Delete for good', async () => { await mutate('DELETE', '/api/users/' + u.id); toast('Member deleted'); }); },
  logout: async () => { try { await api('POST', '/api/logout'); } catch (e) {} location.replace('/login.html'); },
  savename: async () => { try { await mutate('PUT', '/api/me', { name: $('#me-name').value }); toast('Name saved'); } catch (e) { toast(e.message); } },
  changepw: async el => {
    const err = $('#pw-err'); err.textContent = '';
    const cur = $('#pw-cur').value, n1 = $('#pw-new').value, n2 = $('#pw-new2').value;
    if (n1 !== n2) { err.textContent = "The new passwords don't match."; return; }
    el.disabled = true;
    try { await mutate('POST', '/api/me/password', { currentPassword: cur, newPassword: n1 }); toast('Password updated'); location.hash = 'dashboard'; }
    catch (e) { err.textContent = e.message; el.disabled = false; }
  },
  export: async () => {
    const items = filteredTx();
    const rows = [['Date', 'Type', 'Whose', 'Relationship', 'Spent by (household)', 'Debited from (household)', 'Added by', 'Category', 'Sub-category', 'Payment mode', 'Amount', 'Note', 'Tags']];
    items.forEach(i => rows.push([i.date, i.type || 'expense', i.owner === HH ? 'Household' : rawName(i.owner), i.owner === HH ? '' : relOf(i.owner), i.owner === HH && i.spentBy ? rawName(i.spentBy) : '', i.owner === HH ? rawName(i.debitFrom || SHARED) : '', i.by ? rawName(i.by) : '', entryLabel(i), i.sub || '', i.mode || '', i.amount, i.note || '', (i.tags || []).join(' ')]));
    const csv = rows.map(r => r.map(v => { const s = String(v ?? ''); return /[",\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s; }).join(',')).join('\n');
    const fname = 'expenses-' + todayISO() + '.csv';
    const url = URL.createObjectURL(new Blob(['\ufeff' + csv], { type: 'text/csv;charset=utf-8' }));
    const a = document.createElement('a'); a.href = url; a.download = fname; document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 2000);
  },
};
function collectCats() {
  document.querySelectorAll('#catlist .catrow').forEach(row => {
    const c = S.config.categories[+row.dataset.i]; if (!c) return;
    c.color = row.querySelector('[data-k=color]').value;
    c.name = row.querySelector('[data-k=name]').value.trim() || c.name;
    c.subs = row.querySelector('[data-k=subs]').value.split(',').map(s => s.trim()).filter(Boolean);
  });
}
try { const t = localStorage.getItem('et-theme'); if (t && t !== 'auto') document.documentElement.dataset.theme = t; } catch (e) {}
boot();
</script>
